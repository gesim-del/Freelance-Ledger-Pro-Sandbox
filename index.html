"<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src data: blob:; font-src 'self' data:;\"> <link rel=\"manifest\" href=\"manifest.json\"> <meta name=\"theme-color\" content=\"#0c0c0e\"> <meta name=\"mobile-web-app-capable\" content=\"yes\"> <meta name=\"apple-mobile-web-app-capable\" content=\"yes\"> <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"> <meta name=\"apple-mobile-web-app-title\" content=\"Calder Studio\"> <link rel=\"apple-touch-icon\" href=\"apple-touch-icon.png\"> <link rel=\"icon\" href=\"icon.png\">\n  <title>Calder Studio<\u002Ftitle>\n  <style>/* CelAe — industrial/utilitarian dark instrument aesthetic.\n   Sidebar of icon tools + popout panels; canvas is the hero. */\n\n:root {\n  --bg:        #0c0c0e;\n  --surface:   #141417;\n  --surface-2: #1c1c21;\n  --line:      #2a2a31;\n  --ink:       #e8e6e1;\n  --ink-dim:   #8a8a93;\n  --accent:    #f0a020;\n  --accent-dim:#7a5410;\n  --danger:    #d2604a;\n  --canvas-bg: #f4f2ec;\n  --mono: \"SFMono-Regular\", \"JetBrains Mono\", \"Cascadia Mono\", Menlo, Consolas, monospace;\n  --side-w: 46px;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n/* the hidden attribute must always win over display:flex/grid set elsewhere */\n[hidden] { display: none !important; }\nhtml, body {\n  height: 100%; background: var(--bg); color: var(--ink);\n  font-family: var(--mono); font-size: 11px;\n  -webkit-user-select: none; user-select: none; overflow: hidden;\n}\n\n/* ===== app shell: sidebar + main ===== */\n.app { height: 100vh; display: flex; position: relative; }\n\n.sidebar {\n  width: var(--side-w); flex: 0 0 var(--side-w);\n  background: var(--surface); border-right: 1px solid var(--line);\n  display: flex; flex-direction: column; align-items: center;\n  padding: 6px 0; gap: 4px;\n}\n.side-group { display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center; }\n.side-divider { width: 60%; height: 1px; background: var(--line); margin: 5px 0; }\n.side-spacer { flex: 1; }\n\n.ico {\n  width: 34px; height: 34px;\n  background: var(--surface-2); border: 1px solid var(--line);\n  border-radius: 5px; color: var(--ink); font-size: 16px;\n  cursor: pointer; display: flex; align-items: center; justify-content: center;\n  transition: border-color .12s, background .12s, color .12s;\n  position: relative;\n}\n.ico:hover { border-color: var(--accent-dim); }\n.ico.active { background: var(--accent); color: #1a1206; border-color: var(--accent); }\n.ico[disabled] { opacity: .4; cursor: not-allowed; }\n.ico.send-ico { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 700; }\n.swatch { width: 16px; height: 16px; border-radius: 3px; background: #1a1a1f; border: 1px solid var(--ink-dim); display: block; }\n\n/* color popup: full HSV picker */\n.cp { display: flex; flex-direction: column; gap: 7px; }\n.cp-sv { width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); cursor: crosshair; display: block; touch-action: none; }\n.cp-hue { width: 100%; height: 14px; border-radius: 3px; border: 1px solid var(--line); cursor: crosshair; display: block; touch-action: none; }\n.cp-row { display: flex; align-items: center; gap: 7px; }\n.cp-preview { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 4px; border: 1px solid var(--ink-dim); }\n.cp-hex {\n  flex: 1; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);\n  border-radius: 3px; padding: 5px 7px; font-family: var(--mono); font-size: 11px;\n}\n.cp-hex:focus { outline: none; border-color: var(--accent-dim); }\n\n\n.ico-sm {\n  width: 22px; height: 22px; background: transparent; border: 1px solid var(--line);\n  border-radius: 4px; color: var(--ink-dim); cursor: pointer; font-size: 12px;\n}\n.ico-sm:hover { color: var(--ink); border-color: var(--accent-dim); }\n\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n\n/* ===== header ===== */\n/* ===== fixed top menu bar (spans the whole app, above tools + node view) ===== */\n#workspace { padding-top: 38px; box-sizing: border-box; }\n#topbar {\n  position: fixed; top: 0; left: 0; right: 0; height: 38px; z-index: 200;\n  display: flex; align-items: center; gap: 4px;\n  padding: 0 10px; background: #14171e; border-bottom: 1px solid #0d0f13;\n}\n#topbar .ico-sm { margin-right: 2px; }\n.menubar { display: flex; align-items: center; gap: 1px; }\n.menu { position: relative; }\n.menu-label {\n  background: none; border: 0; color: #cfd6e4; font: 500 12px system-ui;\n  padding: 6px 10px; border-radius: 5px; cursor: pointer;\n}\n.menu-label:hover, .menu.open .menu-label { background: #242a34; color: #fff; }\n.menu-drop {\n  position: absolute; top: calc(100% + 4px); left: 0; display: none;\n  min-width: 210px; background: #1b1f27; border: 1px solid #333a48;\n  border-radius: 8px; padding: 5px; z-index: 210;\n  box-shadow: 0 14px 34px rgba(0,0,0,.5);\n}\n.menu.open .menu-drop { display: block; }\n.menu-drop button {\n  display: block; width: 100%; text-align: left; background: none; border: 0;\n  color: #cfd6e4; font: 12px system-ui; padding: 7px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap;\n}\n.menu-drop button:hover { background: #134e57; color: #9adfe8; }\n.menu-drop button:disabled { opacity: .35; cursor: default; }\n.menu-drop button:disabled:hover { background: none; color: #cfd6e4; }\n.menu-key { float: right; margin-left: 24px; opacity: .5; font-size: 10px; }\n.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }\n.scene-tabs { display: flex; align-items: center; gap: 3px; margin-left: 10px; max-width: 46vw; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }\n.scene-tabs::-webkit-scrollbar { height: 5px; }\n.scene-tab { display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px 3px 9px; background: #171b23; border: 1px solid #2a3140; border-bottom: none; border-radius: 6px 6px 0 0; color: #9aa4b4; font: 11px system-ui; cursor: pointer; white-space: nowrap; max-width: 160px; }\n.scene-tab:hover { background: #1d222c; color: #c8d0dc; }\n.scene-tab.on { background: #222834; color: #ffd24a; border-color: #4a5266; }\n.scene-tab .st-name { overflow: hidden; text-overflow: ellipsis; max-width: 128px; }\n.scene-tab .st-name input { width: 96px; font: inherit; background: #0f1218; color: #e6e9ef; border: 1px solid #3a4356; border-radius: 3px; padding: 0 3px; }\n.scene-tab .st-x { flex: none; width: 13px; height: 13px; line-height: 12px; text-align: center; border-radius: 3px; color: #7a8494; font-size: 12px; }\n.scene-tab .st-x:hover { background: #7a2a2a; color: #fff; }\n.scene-tab.solo .st-x { display: none; }\n.scene-tab-add { flex: none; width: 20px; height: 20px; border: 1px solid #2a3140; border-radius: 5px; background: #171b23; color: #9aa4b4; cursor: pointer; font-size: 13px; line-height: 1; }\n.scene-tab-add:hover { background: #222834; color: #ffd24a; }\n#creditTop { color: #8a94a4; text-decoration: none; font-size: 11px; white-space: nowrap; }\n#creditTop b { color: #c8d0dc; }\n#creditLic { background: none; border: none; color: #8a94a4; font-family: var(--mono); font-size: 11px; cursor: pointer; padding: 0; white-space: nowrap; text-decoration: underline; text-underline-offset: 2px; }\n#creditLic:hover { color: #9adfe8; }\n.topbar-fs { background: none; border: 1px solid #333a48; color: #cfd6e4; border-radius: 6px; width: 26px; height: 24px; cursor: pointer; font-size: 13px; line-height: 1; }\n.topbar-fs:hover { border-color: var(--accent-dim); color: #fff; }\n.topbar-logo { display: inline-flex; align-items: center; }\n.topbar-logo svg { height: 30px; width: 30px; display: block; }\n/* ===== iPad (PWA build) safe-area spacing. Gated on html.cs-ipad, set ONLY when\n   window.__csIsIPad is present (the PWA build), so the desktop app is untouched.\n   Keeps the top bar (File/Scene/Export menus + full-screen button) clear of the\n   iPadOS status bar (clock/battery), the window controls (close/minimise/expand),\n   and the notch/home-indicator safe areas. The left/right minimums (92px/76px) are\n   sized to clear the window controls and the battery cluster; tell me if either\n   needs nudging on your layout. ===== */\nhtml.cs-ipad #topbar {\n  height: calc(38px + env(safe-area-inset-top, 0px));\n  padding-top: env(safe-area-inset-top, 0px);\n  padding-left: max(10px, calc(env(safe-area-inset-left, 0px) + 92px));\n  padding-right: max(10px, calc(env(safe-area-inset-right, 0px) + 76px));\n  box-sizing: border-box;\n}\nhtml.cs-ipad #workspace { padding-top: calc(38px + env(safe-area-inset-top, 0px)); }\nhtml.cs-ipad .app { padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }\n.status { font-size: 10px; color: var(--ink-dim); flex: 0 1 auto; line-height: 1.3; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }\n.status.err { color: var(--danger); }\n\n/* ===== canvas ===== */\n.stageWrap {\n  flex: 1; position: relative;\n  background: repeating-linear-gradient(45deg, #0e0e10 0 8px, #0b0b0d 8px 16px);\n  overflow: auto;\n  /* We pan by setting scrollLeft/scrollTop from pointer deltas ourselves.\n     touch-action:none stops the browser from ALSO interpreting a pen drag as\n     a native scroll gesture — that native handling axis-locks the first part\n     of the move (horizontal OR vertical) until it decides the drag is\n     diagonal. Disabling it gives clean freeform panning from the first pixel. */\n  touch-action: none;\n}\n/* The sizer is sized by JS to (canvas + a margin of pan space all around),\n   so there's room to scroll past the canvas edges in every direction. The\n   canvas is centred inside it. */\n.stageSizer {\n  position: relative; line-height: 0;\n  box-sizing: content-box;\n}\n.stageSizer canvas { transform-origin: top left; display: block; }\n#stage {\n  background: var(--canvas-bg);\n  border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.55);\n  cursor: crosshair; touch-action: none;\n}\n#stage:focus, #stage:focus-visible { outline: none; }\n\n/* ===== transport (full row) ===== */\n.transport {\n  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\n  padding: 7px 10px; background: var(--surface); border-top: 1px solid var(--line);\n  position: relative;   /* anchor for the floating .selBar so it never reflows the row */\n}\n.tbtn {\n  flex: 0 0 auto; min-width: 32px; height: 28px;\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;\n  color: var(--ink); font-size: 13px; cursor: pointer;\n  transition: border-color .12s, transform .05s;\n}\n.tbtn:hover { border-color: var(--accent-dim); }\n.tbtn:active { transform: translateY(1px); }\n.tbtn.accent { color: var(--accent); border-color: var(--accent-dim); font-weight: 700; }\n.tbtn.active { background: var(--accent); color: #1a1206; border-color: var(--accent); }\n.tbtn.danger:hover { border-color: var(--danger); }\n.tbtn.playing { background: var(--accent); color: #1a1206; }\n/* fixed width + tabular figures so scrubbing (1 digit -> 2 -> 3) never changes\n   the counter's width. A width change here used to tip the wrapping transport\n   row onto another line, which resized the canvas scroller and made the view\n   jump when you moved along the timeline. */\n.frameCounter { font-size: 11px; color: var(--ink-dim); margin: 0 4px; white-space: nowrap;\n  display: inline-block; min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }\n.frameCounter b { color: var(--accent); }\n.play-fps { flex: 0 0 auto; flex-direction: row; align-items: center; gap: 3px; }\n.play-fps input { width: 36px; }\n.play-fps span { font-size: 9px; color: var(--ink-dim); }\n\n/* ===== multi-track timeline (full row, resizable) ===== */\n.timeline {\n  display: flex; flex-direction: column;\n  height: 140px;            /* default; JS overrides via drag */\n  background: var(--surface); border-top: 1px solid var(--line);\n  position: relative;\n}\n/* drag grip on the very top edge to resize the panel height */\n.tl-resize {\n  height: 6px; cursor: row-resize; flex: 0 0 6px;\n  background: linear-gradient(180deg, rgba(240,160,32,.18), transparent);\n  border-top: 1px solid var(--line);\n}\n.tl-resize:hover { background: linear-gradient(180deg, rgba(240,160,32,.4), transparent); }\n/* touch-action:none is what makes DRAG-SELECT possible with a pen. Without it\n   Chrome ALSO reads a pen drag on the rows as a native pan of this scroller,\n   claims the gesture, and fires pointercancel - which tore the marquee down\n   mid-drag and slid the timeline sideways instead of selecting anything.\n   preventDefault() on pointerdown cannot stop a pan; only touch-action can.\n   Same fix as .pop-head (see below) and the playhead's inline touchAction.\n   Only pen/touch are affected, never a mouse, which is why this was pen-only.\n   Navigation is unchanged: the scrollbars, the wheel and tlEdgeScroll all\n   still scroll the timeline. */\n.tl-scroll { flex: 1; overflow: auto; min-height: 0; touch-action: none; }\n.tl-rows { display: flex; flex-direction: column; gap: 0; min-width: min-content; }\n\n/* one layer row = fixed header cell + scrolling frame track */\n.tl-row {\n  display: flex; align-items: stretch; min-height: 36px;\n  border-bottom: 1px solid var(--line);\n}\n.tl-row.active { background: rgba(240,160,32,.05); }\n.tl-row.active .tl-head { border-left: 3px solid var(--accent); }\n\n.tl-head {\n  flex: 0 0 var(--tl-head-w, 196px); min-width: var(--tl-head-w, 196px); max-width: var(--tl-head-w, 196px); overflow: hidden;\n  display: flex; align-items: center; gap: 4px;\n  padding: 0 6px; background: var(--surface-2); border-right: 1px solid var(--line);\n  border-left: 3px solid transparent; cursor: pointer;\n  /* z-index must sit ABOVE the scrolling track bands (key diamonds z7, path\n     strip z7/8, dragged cell z5, marquee z6) so the sticky name column always\n     covers them instead of the bands bleeding over it; still below the playhead\n     (z40). This is what stopped the \"layer cards gone transparent / timeline\n     runs past the name column\" look. */\n  position: sticky; left: 0; z-index: 12;\n}\n/* drag grip on the ruler's \"frames\" head - widens the layer-name column */\n.cs-rhead { position: relative; overflow: visible; }\n.tl-head-resize {\n  position: absolute; top: 0; right: 0; width: 9px; height: 100%;\n  cursor: col-resize; z-index: 6; touch-action: none;\n}\n.tl-head-resize::after {\n  content: \"\"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);\n  width: 2px; height: 14px; background: var(--ink-dim, #6b7484); border-radius: 1px;\n}\n.tl-head-resize:hover::after, .tl-head-resize.drag::after { background: var(--accent, #f0a020); height: 20px; }\n.tl-eye {\n  flex: 0 0 auto; width: 18px; height: 18px; padding: 0;\n  background: none; border: none; color: var(--accent);\n  font-size: 12px; cursor: pointer; line-height: 1;\n}\n.tl-eye.off { color: var(--ink-dim); }\n.tl-name {\n  flex: 1; min-width: 0; background: none; border: none; color: var(--ink);\n  font-family: var(--mono); font-size: 10px; padding: 2px 0;\n}\n.tl-name:focus { outline: none; color: var(--accent); }\n.tl-op { flex: 0 0 auto; display: flex; align-items: center; gap: 1px; }\n.tl-op-in {\n  width: 30px; background: var(--surface); border: 1px solid var(--line);\n  border-radius: 3px; color: var(--ink); font-family: var(--mono);\n  font-size: 10px; padding: 1px 2px; text-align: right;\n}\n.tl-op-in:focus { outline: none; border-color: var(--accent-dim); }\n.tl-op-pct { font-family: var(--mono); font-size: 9px; color: var(--ink-dim); }\n.tl-reorder { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0; }\n.tl-move {\n  width: 14px; height: 9px; padding: 0; line-height: 8px;\n  background: none; border: none; color: var(--ink-dim);\n  font-size: 7px; cursor: pointer;\n}\n.tl-move:hover:not(:disabled) { color: var(--accent); }\n.tl-move:disabled { opacity: .25; cursor: default; }\n\n/* the frame track */\n.tl-track {\n  flex: 1; display: flex; align-items: center; gap: 0;\n  padding: 4px 6px; min-width: min-content;\n}\n/* ruler row: the band must share the CELLS' x-origin — virtualized cells are\n   absolutely positioned from the track's padding-box edge, so the ruler track\n   drops its left padding to keep frame 0 of the band and of every row's cells\n   at the same x (playhead + ruler + cells align by construction) */\n.cs-ruler .tl-track { padding-left: 0; padding-right: 0; }\n/* the ruler row lives directly in #tlScroll (not inside .tl-rows), so as a\n   block child it sized to the SCROLLPORT, not the content — scrolling past\n   that width ran its sticky \"frames\" head out of its containing block and\n   dragged it off-screen. min-content makes it span its band like every row. */\n.cs-ruler { min-width: min-content; }\n.tl-cell {\n  position: relative; flex: 0 0 auto;\n  height: 26px; margin-right: 3px;\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;\n  color: var(--ink-dim); font-family: var(--mono); cursor: pointer;\n  display: flex; align-items: center; justify-content: center;\n  transition: transform .08s, opacity .12s, border-color .12s;\n  touch-action: none; overflow: hidden;\n}\n.tl-cell.current { border-color: var(--accent); color: var(--accent); background: rgba(240,160,32,.12); }\n.tl-cell.empty { border-style: dashed; opacity: .55; }\n.tl-cell.dragging { opacity: .85; border-color: var(--accent); z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.55); }\n.tl-cell.dropbefore { box-shadow: -3px 0 0 var(--accent); }\n.tl-cell.dropafter  { box-shadow:  3px 0 0 var(--accent); }\n.tl-cell .tl-lbl { font-size: 11px; pointer-events: none; }\n/* virtualized track: cells are absolutely positioned at unit*CELL_UNIT so only\n   the on-screen ones need to exist (huge scenes stay responsive) */\n.tl-track.virt { display: block; position: relative; }\n.tl-track.virt .tl-cell { position: absolute; top: 5px; margin: 0; }\n.tl-cell .tl-hold {\n  position: absolute; bottom: 0; right: 3px; font-size: 8px; color: var(--accent); pointer-events: none;\n}\n.tl-cell .tl-grip {\n  position: absolute; top: 0; right: 0; width: 7px; height: 100%;\n  cursor: ew-resize; background: linear-gradient(90deg, transparent, rgba(240,160,32,.3));\n}\n.tl-cell .tl-grip-left {\n  right: auto; left: 0;\n  background: linear-gradient(90deg, rgba(77,141,229,.35), transparent);\n}\n\n/* footer with layer add/delete + hint */\n.tl-foot {\n  flex: 0 0 auto; display: flex; align-items: center; gap: 6px;\n  padding: 5px 10px; background: var(--surface); border-top: 1px solid var(--line);\n}\n.tl-foot .tbtn { min-width: auto; padding: 0 8px; font-size: 10px; }\n.tl-hint { font-size: 9px; color: var(--ink-dim); margin-left: 6px; flex: 1; }\n\n\n/* ===== popouts ===== */\n.popout {\n  position: absolute; left: calc(var(--side-w) + 6px); top: 44px; z-index: 45;\n  min-width: 180px; max-width: 240px;\n  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n  box-shadow: 0 10px 34px rgba(0,0,0,.6); padding: 10px;\n  display: flex; flex-direction: column; gap: 8px;\n  /* NEVER TALLER THAN THE WINDOW. The guides panel in particular has grown well\n     past a short screen, and the bottom of it was simply cut off. JS narrows\n     this further to the space actually below the panel's top edge; this is the\n     backstop for anything JS has not placed yet. */\n  max-height: calc(100vh - 96px); overflow-y: auto; overscroll-behavior: contain;\n}\n/* CRITICAL: display:flex above would otherwise override the hidden attribute,\n   leaving every popout visible. This restores hide-on-[hidden]. */\n.popout[hidden] { display: none !important; }\n/* once positioned/dragged, JS sets inline left/top which wins over the above */\n.pop-head {\n  display: flex; justify-content: space-between; align-items: center;\n  font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim);\n  border-bottom: 1px solid var(--line); padding-bottom: 6px;\n  touch-action: none;   /* a pen drag here must NOT also be a native scroll gesture (only pen/touch are affected, never a mouse - that is why this bug was pen-only) */\n  /* stays put while the rest of the panel scrolls, so the title and the close\n     cross are always where you left them */\n  position: sticky; top: -10px; z-index: 3;\n  background: var(--surface); margin-top: -10px; padding-top: 10px;\n}\n/* a pen may SCROLL the panel body, but the header still drags the box and the\n   controls still take a drag of their own (see the rules just below) */\n.popout { touch-action: pan-y; }\n.popout input, .popout select, .popout textarea, .popout button, .popout canvas, .popout .row { touch-action: none; }\n.pop-x { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 11px; }\n.pop-x:hover { color: var(--ink); }\n.pop-divider { height: 1px; background: var(--line); margin: 8px 0 6px; }\n\n/* controls inside popouts/rows */\n.ctl { display: flex; flex-direction: column; gap: 4px; }\n.ctl > span { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); }\n.ctl b { color: var(--accent); font-weight: 600; }\n.ctl.slider input[type=range] { width: 100%; }\n.ctl.check { flex-direction: row; align-items: center; gap: 5px; }\n.ctl.tiny { flex-direction: row; align-items: center; gap: 5px; }\n.ctl.tiny input { width: 46px; }\n.row { display: flex; align-items: center; gap: 8px; }\n.row.btns { flex-wrap: wrap; }\n\nselect, input[type=number] {\n  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);\n  border-radius: 3px; padding: 4px 6px; font-family: var(--mono); font-size: 11px;\n}\ninput[type=color] { width: 100%; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: none; cursor: pointer; }\ninput[type=range] { -webkit-appearance: none; height: 3px; background: var(--line); border-radius: 2px; }\ninput[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--surface); }\n\n.btn {\n  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);\n  border-radius: 3px; padding: 6px 10px; font-family: var(--mono); font-size: 10px;\n  cursor: pointer; transition: border-color .12s; text-align: center;\n}\n.btn:hover { border-color: var(--accent-dim); }\n.btn.primary { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 700; }\n.btn.off { border-color: var(--accent-dim); color: var(--accent); }\n\n/* timeline layer-type indicators (colour sub-layer / image layer).\n   Use an INSET box-shadow for the coloured edge stripe instead of a border,\n   so the indicator doesn't shift the row's content right — colour/image rows\n   line up identically with normal layers. */\n.tl-type { width: 14px; flex: 0 0 14px; text-align: center; font-size: 10px; line-height: 1; opacity: .85; }\n.tl-row.tl-color .tl-head { box-shadow: inset 3px 0 0 0 #8a5cd8; }   /* purple = colour */\n.tl-row.tl-color.active .tl-head { box-shadow: inset 3px 0 0 0 #a47ce8; }\n.tl-row.tl-color .tl-name { color: #c9b3ee; }\n.tl-row.tl-image .tl-head { box-shadow: inset 3px 0 0 0 #3a9bdc; }   /* blue = image */\n.tl-row.tl-image.active .tl-head { box-shadow: inset 3px 0 0 0 #5fb0e8; }\n.tl-row.tl-image .tl-name { color: #a9d2ef; }\n\n.hint { font-size: 9px; color: var(--ink-dim); line-height: 1.5; }\n.hint b { color: var(--accent); }\n/* A HINT THAT ONLY OPENS ON HOVER, so a panel full of help text does not have\n   to stand permanently tall. Collapsed it is a small \"?\" tab; hovering (or\n   focusing, so keyboard/pen users reach it) drops the full text in. It takes no\n   height while collapsed, so the box shrinks to the controls. */\n.hint.foldable {\n  max-height: 14px; overflow: hidden; cursor: help; position: relative;\n  padding-left: 15px; opacity: .8;\n  transition: max-height .18s ease, opacity .18s ease;\n}\n.hint.foldable::before {\n  content: \"?\"; position: absolute; left: 0; top: 0;\n  width: 12px; height: 12px; line-height: 12px; text-align: center;\n  border-radius: 50%; background: var(--panel-2, #2a2f3a); color: var(--ink-dim);\n  font-size: 9px; font-weight: 700;\n}\n/* hovering must NOT expand it in-flow (that pushed the colour stops / palette around and\n   made you nudge colours by accident) - the full text shows as a button-style tooltip\n   (title) instead. Clicking still opens it in place. */\n.hint.foldable.open {\n  max-height: 240px; opacity: 1;\n}\n.hint.foldable:hover { opacity: 1; }\n\n/* onion chips */\n.onion-row { gap: 6px; }\n.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; font-family: var(--mono); font-size: 10px; color: var(--ink-dim); cursor: pointer; }\n.chip.prev.on { border-color: #c14646; color: #e98a8a; }\n.chip.next.on { border-color: #466ec1; color: #8aa9e9; }\n\n/* selection mini-toolbar — a FLOATING pill anchored to the transport's top-right.\n   It used to be inline in the transport row, so showing it (on a stroke selection,\n   or clearing it on a frame change) reflowed the wrapping row, resized the canvas\n   scroller and scrolled the view. Absolute positioning takes it out of the flow\n   entirely, so it can never move the canvas. */\n.selBar {\n  position: absolute; top: 5px; right: 10px; z-index: 6;\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 3px 6px 3px 10px; border: 1px solid var(--line); border-radius: 4px;\n  background: var(--surface-2); box-shadow: 0 2px 8px rgba(0,0,0,.4);\n  font-size: 10px; color: var(--accent);\n}\n.selBar .tbtn { min-width: auto; height: 24px; padding: 0 8px; font-size: 10px; }\n\n/* corner-pin overlay */\n/* overflow-anchor: none — Chrome's scroll anchoring nudges a scroller's\n   position when its DOM changes (selection overlays / floatbar appearing),\n   which read as the canvas \"panning up a touch\" on select. The canvas view\n   must only ever move when the user pans it. */\n.stageWrap { position: relative; overflow-anchor: none; }\n.cornerOverlay { position: absolute; pointer-events: none; overflow: visible; }\n.cornerDot { fill: var(--accent); stroke: #1a1206; stroke-width: 2; pointer-events: all; cursor: move; }\n.cornerDot:hover { fill: #ffb733; }\n/* contour overlay handles */\n.contourDot { fill: #66c0ff; stroke: #06203a; stroke-width: 1.5; pointer-events: all; cursor: move; }\n.contourAnchor { fill: var(--accent); stroke: #1a1206; stroke-width: 1.5; pointer-events: all; cursor: move; }\n.contourLine { stroke: rgba(102,192,255,.6); stroke-width: 1; fill: none; }\n\n/* ===== zoom control in the transport ===== */\n.zoomCtl {\n  display: flex; align-items: center; gap: 4px;\n  padding: 0 6px; margin: 0 2px;\n  border-left: 1px solid var(--line); border-right: 1px solid var(--line);\n}\n.zoomCtl input[type=range] {\n  width: 96px; height: 3px; background: var(--line); border-radius: 2px;\n}\n.zoomPct {\n  min-width: 42px; height: 28px; padding: 0 4px;\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;\n  color: var(--ink-dim); font-family: var(--mono); font-size: 10px; cursor: pointer;\n  transition: border-color .12s, color .12s;\n}\n.zoomPct:hover { border-color: var(--accent-dim); color: var(--ink); }\n\n/* ===== help / wiki overlay ===== */\n.helpOverlay {\n  position: absolute; inset: 0; z-index: 60;\n  background: rgba(6,6,8,.72);\n  display: flex; align-items: center; justify-content: center;\n  padding: 24px;\n  /* subtle vignette so the modal reads as lifted off the panel */\n  backdrop-filter: blur(2px);\n  animation: helpFade .14s ease-out;\n}\n.helpOverlay[hidden] { display: none !important; }\n@keyframes helpFade { from { opacity: 0; } to { opacity: 1; } }\n\n.helpModal {\n  width: min(720px, 100%); height: min(560px, 100%);\n  display: flex; flex-direction: column;\n  background: var(--surface);\n  border: 1px solid var(--line); border-radius: 8px;\n  box-shadow: 0 24px 70px rgba(0,0,0,.7);\n  overflow: hidden;\n  animation: helpRise .16s ease-out;\n}\n@keyframes helpRise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }\n\n.helpBar {\n  display: flex; align-items: center; gap: 12px;\n  padding: 10px 14px; background: var(--surface-2);\n  border-bottom: 1px solid var(--line);\n}\n.helpKicker {\n  font-size: 9px; text-transform: uppercase; letter-spacing: .18em;\n  color: var(--ink-dim); font-weight: 400; margin-left: 4px;\n}\n.helpSearchWrap { flex: 1; display: flex; justify-content: flex-end; }\n#helpSearch {\n  width: 160px; background: var(--surface); color: var(--ink);\n  border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px;\n  font-family: var(--mono); font-size: 11px;\n}\n#helpSearch:focus { outline: none; border-color: var(--accent-dim); }\n.helpClose {\n  width: 26px; height: 26px; border-radius: 5px; cursor: pointer;\n  background: var(--surface); border: 1px solid var(--line); color: var(--ink-dim); font-size: 12px;\n}\n.helpClose:hover { color: var(--ink); border-color: var(--danger); }\n\n.helpBody { flex: 1; display: flex; min-height: 0; }\n\n.helpNav {\n  flex: 0 0 150px; display: flex; flex-direction: column; gap: 2px;\n  padding: 12px 8px; background: var(--surface-2); border-right: 1px solid var(--line);\n  overflow-y: auto;\n}\n.helpTab {\n  text-align: left; background: none; border: 1px solid transparent;\n  border-radius: 4px; padding: 8px 10px; cursor: pointer;\n  color: var(--ink-dim); font-family: var(--mono); font-size: 10px;\n  text-transform: uppercase; letter-spacing: .08em;\n  transition: color .12s, background .12s, border-color .12s;\n}\n.helpTab:hover { color: var(--ink); border-color: var(--line); }\n.helpTab.active { color: var(--accent); background: var(--surface); border-color: var(--accent-dim); }\n\n.helpContent { flex: 1; overflow-y: auto; padding: 18px 22px; }\n.helpContent h2 {\n  font-size: 14px; letter-spacing: .04em; color: var(--ink); margin-bottom: 4px; font-weight: 700;\n}\n.helpContent .helpBlurb {\n  font-size: 11px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 16px;\n  padding-bottom: 14px; border-bottom: 1px solid var(--line);\n}\n\n/* tip cards */\n.helpCard {\n  margin-bottom: 12px; padding: 10px 12px;\n  background: var(--surface-2); border: 1px solid var(--line);\n  border-left: 2px solid var(--accent-dim); border-radius: 4px;\n}\n.helpCard .ct { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }\n.helpCard .cb { font-size: 11px; color: var(--ink-dim); line-height: 1.6; }\n\n/* tool rows */\n.helpTool {\n  display: flex; align-items: flex-start; gap: 12px;\n  padding: 9px 4px; border-bottom: 1px solid var(--line);\n}\n.helpTool .ti {\n  flex: 0 0 30px; height: 30px; display: flex; align-items: center; justify-content: center;\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; font-size: 15px;\n}\n.helpTool .tt { flex: 1; }\n.helpTool .tn { font-size: 11px; color: var(--ink); font-weight: 600; }\n.helpTool .tl { font-size: 10px; color: var(--ink-dim); line-height: 1.5; margin-top: 2px; }\n\n/* shortcut rows */\n.helpKey {\n  display: flex; align-items: center; gap: 10px;\n  padding: 7px 4px; border-bottom: 1px solid var(--line);\n}\n.helpKey .kk { flex: 0 0 130px; display: flex; gap: 4px; flex-wrap: wrap; }\n.helpKey .kl { font-size: 11px; color: var(--ink-dim); }\nkbd {\n  display: inline-block; min-width: 18px; text-align: center;\n  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;\n  border-radius: 4px; padding: 2px 6px; font-family: var(--mono); font-size: 10px; color: var(--ink);\n}\n.helpKey .plus { color: var(--ink-dim); font-size: 10px; align-self: center; }\n\n.helpEmpty { font-size: 11px; color: var(--ink-dim); padding: 20px 4px; text-align: center; }\n\n/* ===== collapsed / fullscreen states ===== */\n/* ===== tool dock (pinned popouts) — lives inside the node dock ===== */\n#toolDock {\n  flex: none; max-height: 46%; display: flex; flex-direction: column;\n  background: #14171e; border-top: 1px solid #262b36; z-index: 25;\n}\n#toolDock .td-head {\n  flex: none; padding: 7px 10px; font: 600 10px/1 system-ui; letter-spacing: 1px;\n  color: #8a94a4; border-bottom: 1px solid #262b36; display: flex; align-items: baseline; gap: 8px;\n}\n#toolDock .td-head .td-hint { font-weight: 400; color: #5a6272; letter-spacing: 0; margin-left: auto; }\n#toolDock .td-body { flex: 1; overflow-y: auto; padding: 8px; columns: 250px; column-gap: 8px; }\n#toolDock .td-body .popout.docked { break-inside: avoid; margin: 0 0 8px; display: inline-block; width: 100%; vertical-align: top; }\n#tdResize { flex: none; height: 7px; cursor: ns-resize; background: #20242c; border-top: 1px solid #333a48; border-bottom: 1px solid #0d0f13; touch-action: none; }\n#tdResize:hover { background: #2b313c; }\n.popout.docked {\n  position: static !important; left: auto !important; top: auto !important;\n  width: 100%; max-width: none; min-width: 0; box-sizing: border-box;\n  box-shadow: none; margin: 0 0 8px; border-radius: 6px;\n  /* a docked panel sits inside the dock's own scroller, so it is never capped */\n  max-height: none !important; overflow: visible;\n}\n.app.fullscreen #toolDock { display: none !important; }\n/* floating node view: a draggable, resizable window over the workspace */\n#nodeDock.floating {\n  position: fixed; right: 70px; top: 56px; height: 72vh; width: 620px;\n  min-width: 380px; max-width: none; z-index: 70;\n  border: 1px solid #333a48; border-radius: 10px; overflow: hidden;\n  box-shadow: 0 22px 56px rgba(0,0,0,.6);\n  resize: both;\n}\n#nodeDock.floating #ndHandle { display: none; }\n#nodeDock.floating #ndTop { cursor: move; }\n/* timeline docked at the top: resize grip flips to its bottom edge */\n.app.tl-top .timeline { border-top: none; border-bottom: 1px solid #262b36; }\n.app.tl-top .timeline .tl-resize { order: 99; }\n.app.collapsed .transport { display: none; }\n/* collapse now hides the frame rows / foot / playbar but KEEPS the scene bar\\n   visible \\u2014 that's where the collapse arrow lives, so you can re-open it */\n.app.collapsed .timeline #tlScroll,\n.app.collapsed .timeline .tl-foot,\n.app.collapsed .timeline .tl-resize { display: none; }\n.app.collapsed .timeline { min-height: 0 !important; height: auto !important; }\n/* buttons now living in the top menu bar — hidden from the side tool rail */\n#btnHelp, #btnSettings, #btnOptimize, #btnFile { display: none !important; }\n/* pen / eraser active: hide the OS pointer everywhere over the stage so only\\n   the live brush ring shows (canvas, overscan sizer and the peg overlay) */\nbody.cs-hidecursor #stageWrap,\nbody.cs-hidecursor #stageWrap *,\nbody.cs-hidecursor #pegOverlay { cursor: none !important; }\n.cs-scene-collapse { margin-right: 8px; }\n.app.fullscreen .sidebar,\n.app.fullscreen .bar,\n.app.fullscreen .transport,\n.app.fullscreen .timeline { display: none; }\n.app.fullscreen .stageWrap { padding: 0; }\n/* full-screen focus also hides the fixed top bar + node view (both live\n   OUTSIDE .app), driven by a body class, and reclaims the top-bar space */\nbody.cs-focus #workspace { padding-top: 0 !important; }\nbody.cs-focus #topbar, body.cs-focus #nodeDock { display: none !important; }\n/* Fullscreen exit button — anchored to the APP root (not the scrolling\n   canvas), so it stays pinned to the panel's top-right while you pan/zoom.\n   Sits a little below the top, roughly where the zoom info bar would be. */\n.fs-exit {\n  position: absolute; top: 10px; right: 12px; z-index: 60;\n  width: 32px; height: 32px; border-radius: 6px; cursor: pointer;\n  background: var(--surface); border: 1px solid var(--accent-dim);\n  color: var(--ink); font-size: 15px; line-height: 1;\n  box-shadow: 0 3px 12px rgba(0,0,0,.5);\n}\n.fs-exit:hover { border-color: var(--accent); color: var(--accent); }\n<\u002Fstyle>\n  <style>/* node.css — Calder Studio additions layered over the verbatim CelAe panel. */\n\n:root { --peg:#8ddc7a; --image:#46c8d6; --matte:#e0653c; }\n\n/* ---------------- workspace shell ---------------- */\nhtml, body { height: 100%; margin: 0; }\n#workspace { display: flex; width: 100vw; height: 100vh; overflow: hidden; background: #15171d; }\n#drawScreen { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; display: flex; overflow: hidden; }\n#drawScreen .app, #drawScreen #app { width: 100% !important; height: 100% !important; max-width: none !important; }\n\n/* ---------------- on-canvas transform overlay (matched to #stage by JS) ---------------- */\n#stageSizer { position: relative; }\n#pegOverlay { position: absolute; left: 0; top: 0; z-index: 6; touch-action: none; cursor: move; }\n#pegOverlay[hidden] { display: none; }\n/* CONTROL HANDLES: with nothing selected the overlay is still on screen (it is\n   the only surface the handle markers can live on) but it must not swallow a\n   single pointer event - every click falls straight through to the canvas\n   underneath, exactly as it did when the overlay was hidden. Handle clicks are\n   caught by the engine's own hit test instead. A class, not an inline style, so\n   the hand-tool's inline pointer-events juggling cannot clobber it. */\n#pegOverlay.cs-ovpass { pointer-events: none; }\n\n/* ---------------- timeline playhead ---------------- */\n#tlScroll { position: relative; overflow-anchor: none; }\n#tlPlayhead { position: absolute; top: 0; width: 22px; background: rgba(240, 160, 32, .14); border-left: 2px solid var(--accent, #f0a020); border-right: 1px solid rgba(240, 160, 32, .35); z-index: 40; pointer-events: none; }\n#tlPlayhead[hidden] { display: none; }\n#tlPlayhandle { position: absolute; top: 0; left: 2px; width: 16px; height: 13px; background: var(--accent, #f0a020); cursor: ew-resize; pointer-events: auto; clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 41; }\n.cs-ruler { height: 18px; min-height: 18px; background: var(--surface-2, #171a21); border-bottom: 1px solid var(--line, #2c3140); user-select: none; cursor: ew-resize; }\n.cs-ruler .tl-head { display: flex; align-items: center; font-size: 9px; color: var(--ink-dim, #6b7484); letter-spacing: .08em; text-transform: uppercase; cursor: default; }\n.cs-ruler .tl-track { overflow: visible; }\n.cs-rband { position: relative; height: 18px; }\n.cs-rnum { position: absolute; top: 2px; font-family: var(--mono, monospace); font-size: 9px; color: var(--ink-dim, #9aa3b2); padding-left: 3px; pointer-events: none; }\n.nd-node.t-cam .nd-title { background: #2e4a5f; }\n.nd-node.t-cam { border-color: #3f6a88; }\n.cs-palette { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-top: 1px solid var(--line, #2c3140); align-items: center; }\n.cs-pswatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, .18); cursor: pointer; padding: 0; }\n.cs-pswatch:hover { transform: scale(1.12); }\n.cs-padd { width: 18px; height: 18px; border-radius: 4px; border: 1px dashed rgba(255, 255, 255, .3); background: transparent; color: var(--ink-dim, #9aa3b2); font-size: 12px; line-height: 1; cursor: pointer; }\n.cs-plabel { width: 100%; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim, #6b7484); margin-bottom: 2px; }\n\n/* ---------------- node dock ---------------- */\n#nodeDock { position: relative; flex: 0 0 auto; height: 100%; width: 46%; max-width: 84vw; min-width: 380px; background: #1b1e25; border-left: 1px solid #0d0f13; display: flex; transition: width .14s ease; }\n.nd-node.off { opacity: .4; filter: saturate(.4); }\n/* scrollbars in keeping with the dark UI */\n* { scrollbar-width: thin; scrollbar-color: #333a48 #14171e; }\n*::-webkit-scrollbar { width: 9px; height: 9px; }\n*::-webkit-scrollbar-track { background: #14171e; }\n*::-webkit-scrollbar-thumb { background: #333a48; border-radius: 5px; border: 2px solid #14171e; }\n*::-webkit-scrollbar-thumb:hover { background: #414a5c; }\n*::-webkit-scrollbar-corner { background: #14171e; }\n#nodeDock.collapsed { width: 26px !important; min-width: 26px !important; max-width: 26px; }\n#ndHandle { writing-mode: vertical-rl; text-orientation: mixed; width: 26px; flex: 0 0 26px; background: #20242c; color: #7f8a9b; border: 0; border-right: 1px solid #0d0f13; cursor: pointer; font: 700 10px/1 system-ui; letter-spacing: 2px; }\n#nodeDock.collapsed #ndHandle { background: #262b34; color: #aeb7c6; }\n#nodeDock:not(.collapsed) #ndHandle { display: none; }\n#ndInner { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }\n#nodeDock.collapsed #ndInner { display: none; }\n\n#ndTop { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #21252e; border-bottom: 1px solid #0d0f13; flex-wrap: wrap; }\n.nd-title { font: 700 11px/1 system-ui; color: #cdd5e1; margin-right: 4px; }\n.nd-add { display: flex; gap: 3px; flex-wrap: wrap; }\n.nd-add-btn { font: 600 10px/1 system-ui; color: #c4ccd8; background: #2c313b; border: 1px solid #3a4150; border-radius: 4px; padding: 5px 7px; cursor: pointer; }\n.nd-add-btn:hover { background: #353c47; }\n.nd-spacer { flex: 1 1 auto; }\n#ndCollapse { background: #2c313b; color: #c4ccd8; border: 1px solid #3a4150; border-radius: 4px; width: 24px; height: 22px; cursor: pointer; }\n\n#ndStage { position: relative; flex: 1 1 auto; overflow: hidden; background: #14161c; cursor: grab; touch-action: none; }\n#ndStage.panning { cursor: grabbing; }\n.nd-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px); background-size: 22px 22px; pointer-events: none; }\n#ndWorld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }\n#ndEdges { position: absolute; left: -5000px; top: -5000px; width: 10000px; height: 10000px; overflow: visible; pointer-events: none; }\n#ndEdges path { pointer-events: stroke; fill: none; }\n\n/* ---------------- nodes ---------------- */\n.nd-node { position: absolute; width: 152px; background: #2b3038; border: 1px solid #11141a; border-radius: 5px; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); font: 11px/1.2 system-ui, sans-serif; user-select: none; }\n.nd-node.sel { outline: 2px solid #ffd24a; outline-offset: 1px; }\n.nd-node .hd { display: flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 4px 4px 0 0; cursor: move; color: #fff; background: linear-gradient(#454d5a, #353c47); }\n.nd-node .chip { width: 9px; height: 9px; border-radius: 2px; background: #888; flex: 0 0 auto; }\n.nd-node .play { font-size: 8px; opacity: .55; }\n.nd-node .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }\n.nd-node .ty { font-size: 9px; opacity: .5; }\n.nd-node .cap { height: 4px; border-radius: 0 0 4px 4px; }\n.nd-node .edit, .nd-node .swatch { margin: 5px 6px; display: block; }\n.nd-node .edit { font: 600 10px/1 system-ui; color: #d6dde7; background: #232831; border: 1px solid #3a4150; border-radius: 4px; padding: 5px 0; width: calc(100% - 12px); cursor: pointer; }\n.nd-node .edit:hover { background: #2b313b; }\n.nd-node .swatch { height: 22px; border-radius: 4px; border: 1px solid #11141a; cursor: pointer; }\n\n.t-draw .chip { background: #d8c14a; } .t-draw .cap { background: #d8c14a; }\n.t-peg  .chip { background: var(--peg); } .t-peg .cap { background: var(--peg); } .t-peg .hd { background: linear-gradient(#3f5a3a, #34492f); }\n.t-comp .chip { background: #c0c6d2; } .t-comp .cap { background: #c0c6d2; }\n.t-cut  .chip { background: var(--matte); } .t-cut .cap { background: var(--matte); }\n.t-eff  .chip { background: #6aa6e0; } .t-eff .cap { background: #6aa6e0; }\n.t-card .chip { background: #9a7bd0; } .t-card .cap { background: #9a7bd0; }\n.t-disp .chip { background: #e0653c; } .t-disp .cap { background: #e0653c; } .t-disp .hd { background: linear-gradient(#5a3a34, #49302f); }\n.t-def .chip { background: #b06ae0; } .t-def .cap { background: #b06ae0; } .nd-node.t-def .hd { background: linear-gradient(#4a3a5f, #3a2f49); }\n.pp-bones { max-height: 150px; overflow: auto; border-top: 1px solid var(--line, #2c3140); }\n.pp-bone { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; }\n.pp-bone.on { background: rgba(70, 200, 214, .12); }\n.pp-bone .pp-bname { flex: 1; font-size: 11px; color: var(--ink-dim, #9aa3b2); }\n.pp-bone input { width: 64px; }\n/* centred slider (heel roll): a middle tick line marks the flat-foot centre */\n.pp-center-wrap { position: relative; flex: 1; min-width: 60px; display: flex; align-items: center; }\n.pp-center-wrap input[type=range] { flex: 1; min-width: 0; width: auto; }\n.pp-center-wrap::after { content: \"\"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 2px; height: 15px; background: var(--accent, #f0a020); opacity: .8; border-radius: 1px; pointer-events: none; }\n\n.nd-port { position: absolute; width: 11px; height: 11px; background: #20242c; border: 1.5px solid #6a7384; transform: translateX(-50%); cursor: crosshair; z-index: 2; }\n.nd-port.in { top: -6px; } .nd-port.out { bottom: -6px; }\n.nd-port.k-image { border-color: var(--image); } .nd-port.k-peg { border-color: var(--peg); } .nd-port.k-matte { border-color: var(--matte); } .nd-port.k-any { border-color: #9aa3b2; }\n.nd-port:hover { background: #3a4150; }\n.nd-plabel { position: absolute; top: -20px; transform: translateX(-50%); font: 8px/1 system-ui; color: #7f8a9b; pointer-events: none; }\n\n/* ---------------- peg properties panel ---------------- */\n#ndProps { flex: 0 0 auto; max-height: 46%; overflow: auto; background: #20242c; border-top: 1px solid #0d0f13; padding: 8px 10px; color: #cdd5e1; font: 11px/1.3 system-ui; }\n.pp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }\n.pp-head b { color: var(--peg); font-size: 12px; }\n.pp-frame { margin-left: auto; font-size: 10px; color: #8893a3; }\n.pp-btns { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }\n.pp-b { font: 600 10px/1 system-ui; color: #d6dde7; background: #2a2f38; border: 1px solid #3a4150; border-radius: 4px; padding: 6px 8px; cursor: pointer; }\n.pp-b:hover { background: #323843; }\n.pp-b.on { background: #46c8d6; color: #06222a; border-color: #46c8d6; }\n.pp-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; margin-bottom: 8px; }\n.pp-grid label { color: #aab2c0; font-size: 10px; }\n.pp-grid input { background: #171a20; border: 1px solid #3a4150; border-radius: 3px; color: #eef2f7; padding: 4px 6px; width: 100%; font: 11px system-ui; }\n.pp-key { background: #232831; border: 1px solid #3a4150; border-radius: 3px; color: #586173; cursor: pointer; padding: 3px 6px; font-size: 11px; }\n.pp-key.on { color: #ffd24a; border-color: #7a6320; background: #2c2a1e; }\n.pp-ease { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 10px; color: #8893a3; }\n.pp-ease input, .pp-ease select { background: #171a20; border: 1px solid #3a4150; border-radius: 3px; color: #eef2f7; padding: 3px 5px; font: 10px system-ui; }\n.pp-curve { width: 100%; height: 84px; background: #14161c; border: 1px solid #2a2e38; border-radius: 4px; display: block; touch-action: none; }\n.pp-hint { font-size: 10px; color: #707a8a; margin: 6px 0 0; line-height: 1.4; }\n.pp-hint b { color: #aeb7c6; }\n\n/* ---------------- timeline augmentation ---------------- */\n#tlRows .tl-pegrow { background: rgba(141, 220, 122, .07); }\n#tlRows .tl-pegrow .tl-name { color: var(--peg); font-weight: 600; }\n#tlRows .tl-pegrow .tl-type::before { content: \"\\2923\"; color: var(--peg); }\n/* WARP (deform) rows take the deform node's purple, so control vs warp reads at a glance */\n#tlRows .tl-warprow { background: rgba(176, 106, 224, .08); }\n#tlRows .tl-warprow .tl-name { color: #b06ae0; }\n#tlRows .tl-warprow .tl-type::before { color: #b06ae0; }\n/* faint zebra so neighbouring top-level hierarchy groups separate at a glance.\n   !important because a general nth-child(even) row-zebra rule further down has higher\n   specificity (:nth-child) and would otherwise swallow these on every other row. */\n#tlRows .tl-grp-alt { background: rgba(255, 255, 255, .05) !important; }\n#tlRows .tl-pegrow.tl-grp-alt { background: rgba(141, 220, 122, .13) !important; }\n#tlRows .tl-warprow.tl-grp-alt { background: rgba(176, 106, 224, .14) !important; }\n/* the group the SELECTION sits in gets a soft CYAN wash + a cyan connector bar down its\n   left edge - a DIFFERENT hue from the orange selection so the two never blend, and\n   strong enough to actually see. The selected row itself stays orange (keyfocus, below\n   + !important, wins) so the one you clicked clearly stands out from the rest. */\n#tlRows .tl-grp-sel { background: rgba(70, 200, 214, .12) !important; }\n#tlRows .tl-grp-sel .tl-head { box-shadow: inset 3px 0 0 rgba(70, 200, 214, .8); }\n#tlRows .tl-grp-sel .tl-track { box-shadow: inset 0 0 0 9999px rgba(70, 200, 214, .045); }\n#tlRows .tl-child .tl-type::before { content: \"L\"; color: #6fae5f; font-size: 10px; opacity: .85; }\n#tlRows .tl-warprow.tl-child .tl-type::before { color: #a07ac8; }\n#tlRows .tl-discon { opacity: .42; }\n#tlRows .tl-discon .tl-name { font-style: italic; }\n#tlRows .tl-pegrow .tl-track { position: relative; }\n#tlRows .tl-kf { position: relative; height: 100%; min-height: 20px; }\n#tlRows .tl-diamond { position: absolute; top: 50%; width: 9px; height: 9px; background: #ffd24a; border: 1px solid #9c7a17; transform: translate(-50%, -50%) rotate(45deg); cursor: grab; }\n#tlRows .tl-diamond.hold { background: transparent; border-color: #ffd24a; }\n#tlRows .tl-diamond.sel { background: #fff; border-color: #fff; box-shadow: 0 0 6px 2px rgba(255, 210, 74, .9); width: 11px; height: 11px; }\n/* ANIMATE-PATH key strip: a thin nested row along the bottom of a drawing's\n   timeline row. Its keys are cyan so they never read as the peg's gold keys, and\n   a drawing with no path key yet shows a hollow grey marker to say \"key me\". */\n#tlRows .tl-track { position: relative; }\n#tlRows .tl-pathband { position: absolute; left: 0; bottom: 0; height: 11px; z-index: 7; background: none !important; pointer-events: none; }\n#tlRows .tl-pathband .tl-pdia { position: absolute; top: 50%; width: 8px; height: 8px; background: #35c9c0; border: 1px solid #1c837c; transform: translate(-50%, -50%) rotate(45deg); cursor: pointer; pointer-events: auto; }\n#tlRows .tl-pathband .tl-pdia.ghost { background: transparent; border: 1px dashed #6a7686; }\n#tlRows .tl-pathband .tl-pdia.at { box-shadow: 0 0 5px 1px rgba(53,201,192,.9); }\n#tlRows .tl-pathband .tl-pdia.sel { background: #eaffff; border-color: #eaffff; box-shadow: 0 0 0 1.5px #35c9c0, 0 0 6px 1px rgba(53,201,192,.8); }\n#tlRows .tl-pathband .tl-pdia { cursor: grab; }\n#tlRows .tl-pathlabel { position: absolute; left: 2px; bottom: 0; height: 11px; line-height: 11px; font-size: 8px; color: #35c9c0; opacity: .7; z-index: 8; pointer-events: none; }\n.cs-scenebar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--surface-2, #1a1d24); border-bottom: 1px solid var(--line, #2c3140); font-family: var(--mono, monospace); font-size: 11px; color: var(--ink-dim, #9aa3b2); flex: 0 0 auto; }\n.cs-scenebar input { width: 64px; background: var(--surface, #11131a); border: 1px solid var(--line, #2c3140); border-radius: 4px; color: var(--ink, #e6e9ef); font-family: var(--mono, monospace); font-size: 11px; padding: 2px 6px; text-align: right; }\n.cs-scenebar input:focus { outline: none; border-color: var(--accent, #f0a020); }\n.cs-sl-hint { margin-left: auto; opacity: .55; font-size: 10px; }\n#tlRows .tl-marquee { position: absolute; top: 2px; bottom: 2px; background: rgba(240, 160, 32, .15); border: 1px solid rgba(240, 160, 32, .75); pointer-events: none; z-index: 6; }\n\n/* ---------------- modals ---------------- */\n.cs-modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .55); }\n.cs-modal[hidden] { display: none; }\n/* the sheet must NEVER outgrow the window — on small screens the Render\n   button used to fall off-screen with no way to reach it */\n.cs-sheet { width: 380px; max-width: 92vw; max-height: calc(100vh - 48px); overflow-y: auto; background: #20242c; border: 1px solid #11141a; border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, .55); padding: 16px 18px; color: #d6dde7; font: 12px/1.4 system-ui; }\n.cs-sheet h3 { margin: 0 0 12px; font-size: 14px; color: #fff; }\n.cs-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }\n.cs-row label { width: 88px; color: #aab2c0; font-size: 11px; }\n.cs-row select, .cs-row input { background: #171a20; border: 1px solid #3a4150; border-radius: 4px; color: #eef2f7; padding: 6px 8px; font: 12px system-ui; flex: 1 1 auto; }\n.cs-row input[type=number] { flex: 0 0 auto; }\n.cs-muted { color: #8893a3; font-size: 11px; }\n.cs-note { font-size: 10.5px; color: #7d8696; line-height: 1.5; margin: 10px 0 14px; }\n.cs-actions { display: flex; justify-content: flex-end; gap: 8px; }\n.cs-primary { background: #46c8d6; color: #06222a; border: 0; border-radius: 5px; padding: 8px 16px; font: 600 12px system-ui; cursor: pointer; }\n.cs-primary:disabled { opacity: .55; cursor: default; }\n.cs-ghost { background: #2a2f38; color: #d6dde7; border: 1px solid #3a4150; border-radius: 5px; padding: 8px 14px; font: 600 12px system-ui; cursor: pointer; }\n.cs-progress { display: flex; align-items: center; gap: 8px; margin-top: 12px; }\n#rBar { height: 6px; background: #46c8d6; border-radius: 3px; width: 0; flex: 1 1 auto; transition: width .1s linear; }\n#rPct { font-size: 10px; color: #8893a3; flex: 0 0 auto; }\n\n/* curve editor */\n.cs-curve { width: 372px; }\n#curveCanvas { width: 100%; height: 300px; border: 1px solid #2a2e38; border-radius: 6px; background: #1a1d24; display: block; touch-action: none; }\n.cs-curveval { text-align: center; font: 600 12px ui-monospace, monospace; color: #ffce4a; margin: 8px 0; }\n.cs-easerow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 4px; }\n.cs-easebox { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 9px/1 system-ui; color: #8893a3; text-transform: uppercase; letter-spacing: .4px; }\n.cs-easebox input { width: 58px; background: #171a20; border: 1px solid #3a4150; border-radius: 4px; color: #ffce4a; padding: 6px; font: 600 13px ui-monospace, monospace; text-align: center; }\n.cs-easebox i { font-style: normal; color: #586173; font-size: 9px; }\n.cs-sidetoggle { display: flex; gap: 3px; }\n.cs-sidetoggle button { width: 34px; height: 30px; background: #2a2f38; border: 1px solid #3a4150; border-radius: 5px; color: #c4ccd8; font: 600 15px/1 system-ui; cursor: pointer; }\n.cs-sidetoggle button:hover { background: #323843; }\n.cs-sidetoggle button.on { background: #46c8d6; color: #06222a; border-color: #46c8d6; }\n<\u002Fstyle>\n  <style>/* ============================================================\n   polish.css — harmonization layer (loaded LAST, override-only).\n   Goal: pull the recently-added chrome (audio bar, art rail,\n   palette, loop inputs, rig buttons) back into the app's core\n   \"orange + mono instrument\" language, and add depth/rhythm to\n   the node view without rewriting its working structure.\n   Nothing here changes layout geometry or behaviour.\n   ============================================================ */\n\n:root {\n  --accent-soft: rgba(240, 160, 32, .14);\n  --accent-line: rgba(240, 160, 32, .38);\n  --focus:       #46c8d6;   /* the node-view signal colour, kept as a secondary */\n  --radius:      5px;\n  --shadow-pop:  0 10px 28px rgba(0, 0, 0, .55);\n}\n\n/* ---- unify small utility buttons to the instrument look ---- */\n.cs-au-b,\n.cs-padd {\n  font-family: var(--mono) !important;\n  background: var(--surface-2) !important;\n  border: 1px solid var(--line) !important;\n  color: var(--ink) !important;\n  border-radius: 4px !important;\n  transition: border-color .12s, background .12s, color .12s;\n}\n.cs-au-b:hover,\n.cs-padd:hover { border-color: var(--accent-line) !important; color: var(--ink) !important; }\n.cs-au-b.on {\n  background: var(--accent) !important;\n  color: #1a1206 !important;\n  border-color: var(--accent) !important;\n}\n\n/* ---- scene / loop / audio bar: read as one grouped instrument strip ---- */\n#csAudioCtl { padding-left: 10px; margin-left: 10px !important; border-left: 1px solid var(--line); }\n.cs-sl-label { font-size: 9px !important; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim) !important; }\n.cs-sl-unit  { font-size: 9px !important; color: var(--ink-dim) !important; }\n#csSceneLen, #csLoopA, #csLoopB {\n  background: var(--surface) !important; border: 1px solid var(--line) !important;\n  color: var(--ink) !important; border-radius: 3px !important;\n  font-family: var(--mono) !important; padding: 3px 5px !important;\n}\n#csSceneLen:focus, #csLoopA:focus, #csLoopB:focus { outline: none; border-color: var(--accent-line) !important; }\n\n/* ---- audio strip on the timeline: match the accent, not raw green ---- */\n#csAudioStrip {\n  background: linear-gradient(180deg, #2a2418, #1c1810) !important;\n  border: 1px solid var(--accent-line) !important;\n  color: var(--accent) !important;\n  font-family: var(--mono) !important;\n  border-radius: 4px !important;\n  letter-spacing: .02em;\n}\n\n/* ---- art-layer rail: floating instrument panel (position set by JS drag; toggled from the play bar) ---- */\n#csArtBox {\n  background: rgba(20, 20, 23, .94) !important;\n  border: 1px solid var(--line) !important;\n  border-radius: var(--radius) !important;\n  box-shadow: var(--shadow-pop);\n  padding: 7px !important; gap: 4px !important;\n  backdrop-filter: blur(4px);\n}\n#csArtBox > span:first-child { color: var(--ink-dim) !important; letter-spacing: .12em !important; }\n#csArtBox button {\n  font-family: var(--mono) !important;\n  border-radius: 4px !important;\n  transition: border-color .12s, background .12s, color .12s;\n}\n\n/* ---- linked palette: sit like a proper popout tray under the colour picker ---- */\n.cs-palette {\n  gap: 5px !important;\n  padding: 9px 10px !important;\n  background: var(--surface) !important;\n  border-top: 1px solid var(--line) !important;\n  border-radius: 0 0 6px 6px;\n}\n.cs-plabel { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); width: 100%; margin-bottom: 1px; }\n.cs-pswatch {\n  width: 20px !important; height: 20px !important;\n  border-radius: 4px !important;\n  border: 1px solid rgba(255, 255, 255, .16) !important;\n  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3);\n  transition: transform .08s, outline-color .1s;\n}\n.cs-pswatch:hover { transform: translateY(-1px); }\n.cs-padd { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }\n\n/* ---- gradient editor: a strip of colour with draggable stops under it ---- */\n.cs-grad { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px 2px; border-top: 1px solid var(--line); }\n.cs-grad .cs-grow { display: flex; align-items: center; gap: 5px; }\n.grad-rail { position: relative; height: 40px; }\n.grad-bar {\n  height: 22px; border-radius: 4px; border: 1px solid var(--line);\n  background-image: linear-gradient(90deg, #1a1a1f, #4a90d9);\n  background-color: #fff;\n}\n.grad-stops { position: relative; height: 16px; }\n.grad-stop {\n  position: absolute; top: 1px; width: 13px; height: 13px; margin-left: -7px;\n  border: 1px solid rgba(255,255,255,.75); border-radius: 3px; cursor: ew-resize;\n  box-shadow: 0 1px 3px rgba(0,0,0,.6); box-sizing: border-box; padding: 0;\n}\n.grad-stop.on { border-color: var(--accent); outline: 1px solid var(--accent); }\n.cs-grad .grad-swatch { width: 26px; height: 20px; padding: 0; border: 1px solid var(--line); background: none; }\n\n/* ============================================================\n   NODE VIEW — keep its cyan identity, add hierarchy + depth.\n   ============================================================ */\n\n/* stronger separation of the panel from the canvas */\n#nodeDock { box-shadow: -8px 0 24px rgba(0, 0, 0, .35); }\n#ndTop { border-bottom: 1px solid #0d0f13; }\n\n/* add-node buttons: quieter default, accent on hover so the row isn't a wall of equal chips */\n.nd-add-btn {\n  background: #262b34 !important;\n  border-color: #363d4b !important;\n  transition: background .12s, border-color .12s, color .12s;\n}\n.nd-add-btn:hover { border-color: var(--focus) !important; color: #dff6f9 !important; }\n\n/* nodes: a touch more depth + clearer selection so the graph reads as objects, not tiles */\n.nd-node {\n  box-shadow: 0 3px 10px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .03) !important;\n}\n.nd-node.sel { box-shadow: 0 0 0 2px #ffd24a, 0 6px 16px rgba(0, 0, 0, .5) !important; }\n.nd-node .hd { letter-spacing: .01em; }\n\n/* property-panel buttons: consistent press feedback; keep cyan 'on' as the node-view signal */\n.pp-b { transition: background .12s, border-color .12s, color .12s, transform .04s; }\n.pp-b:active { transform: translateY(1px); }\n.pp-seg { display: inline-flex; gap: 0; border: 1px solid #3a4150; border-radius: 4px; overflow: hidden; }\n.pp-seg .pp-b { border: none !important; border-radius: 0 !important; border-right: 1px solid #3a4150 !important; }\n.pp-seg .pp-b:last-child { border-right: none !important; }\n\n/* rig hint text: a hair larger + more legible for the dense limb instructions */\n.pp-hint { font-size: 10px !important; line-height: 1.5 !important; color: #9aa3b2 !important; }\n.pp-hint b { color: #cdd5e1; }\n\n/* ---- timeline hierarchy: child (drawing) rows read as owned by the peg/deform above ---- */\n/* NOTE: no `position` here — the base .tl-head is position:sticky (pinned name\n   column); `position:relative` on this rule was OVERRIDING sticky, so exactly\n   the rows WITH a control attached scrolled their header away. Sticky is a\n   positioned box, so the ::before elbow still anchors to it. */\n/* progressive hierarchy indent: each nesting level steps the row in, so a control,\n   its drawing, and any nested child controls read as an outline down the timeline */\n.tl-row .tl-head { padding-left: calc(var(--tl-depth, 0) * 13px); }\n.tl-row.tl-child .tl-head::before {\n  content: \"\"; position: absolute; left: calc(max(var(--tl-depth, 1) - 1, 0) * 13px + 5px); top: 0; bottom: 50%;\n  width: 8px; border-left: 1px solid var(--accent-line); border-bottom: 1px solid var(--accent-line);\n  border-radius: 0 0 0 3px;\n}\n.tl-row.tl-discon { opacity: .5; }\n.tl-row:nth-child(even) { background: rgba(255, 255, 255, .015); }\n\n/* ---- primary buttons in the File menu: give New file/Save gentle accent priority ---- */\n#newSession { border-color: var(--accent-line) !important; color: var(--accent) !important; font-weight: 700; }\n#newSession:hover { background: var(--accent-soft) !important; }\n\n/* ---- startup / project modal ---- */\n.cs-proj { max-width: 440px; text-align: center; }\n.cs-proj-brand { font-weight: 800; letter-spacing: .08em; font-size: 22px; color: var(--ink); margin-bottom: 4px; }\n.cs-proj-brand span { color: var(--accent); }\n.cs-proj-brand .cs-proj-beta { font-size: 10px; letter-spacing: .12em; color: #f0c674; background: #2a1e10; border: 1px solid #6e4f1a; border-radius: 5px; padding: 2px 7px; vertical-align: middle; font-weight: 700; }\n.cs-proj-beta-note { background: #2a1e10; border: 1px solid #6e4f1a; border-radius: 6px; padding: 8px 10px; color: #f0c674 !important; }\n.cs-proj-beta-note a { color: #46c8d6; }\n.cs-proj h3 { margin: 2px 0 8px; font-size: 15px; }\n.cs-proj .cs-note { text-align: left; }\n.cs-proj-btns { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 8px; }\n.cs-proj-btns button { width: 100%; padding: 11px 14px; font-size: 12px; border-radius: 6px; }\n.cs-proj-skip { background: none; border: none; color: var(--ink-dim); font-family: var(--mono); font-size: 10px; cursor: pointer; text-decoration: underline; padding: 4px; }\n.cs-proj-skip:hover { color: var(--ink); }\n.cs-proj-warn { color: var(--danger) !important; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }\n\n/* ---- brush presets row ---- */\n.brush-presets { display: flex; gap: 5px; margin-bottom: 9px; }\n.brush-presets .bp {\n  flex: 1; font-family: var(--mono); font-size: 10px; color: var(--ink);\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;\n  padding: 6px 4px; cursor: pointer; transition: border-color .12s, background .12s, color .12s;\n}\n.brush-presets .bp:hover { border-color: var(--accent-line); }\n.brush-presets .bp.active { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 700; }\n\n/* ---- shortcuts remap panel ---- */\n.cs-keys { max-width: 440px; }\n.cs-keys-list { max-height: 46vh; overflow: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; }\n.cs-keys-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); }\n.cs-keys-row:last-child { border-bottom: none; }\n.cs-keys-row:nth-child(even) { background: rgba(255, 255, 255, .015); }\n.cs-keys-lbl { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--ink); }\n.cs-keycap {\n  min-width: 68px; font-family: var(--mono); font-size: 11px; color: var(--ink);\n  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;\n  padding: 5px 10px; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .3);\n  transition: border-color .12s, color .12s;\n}\n.cs-keycap:hover { border-color: var(--accent-line); }\n.cs-keycap.rec { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }\n\n/* ---- in-app dialogs (replace browser prompt/confirm/alert) ---- */\n.cs-dlg-ov { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }\n.cs-dlg { background: #181b22; border: 1px solid #333a48; border-radius: 10px; padding: 18px 20px; min-width: 260px; max-width: 420px; box-shadow: 0 16px 40px rgba(0,0,0,.6); font-family: var(--mono, system-ui); }\n.cs-dlg-msg { color: var(--ink, #e6e9ef); font-size: 13px; line-height: 1.5; margin: 0 0 14px; }\n.cs-dlg-input { width: 100%; box-sizing: border-box; background: #0f1116; border: 1px solid #333a48; color: var(--ink, #e6e9ef); border-radius: 5px; padding: 7px 9px; font: 13px var(--mono, monospace); margin-bottom: 14px; }\n.cs-dlg-input:focus { outline: none; border-color: var(--accent, #f0a020); }\n.cs-dlg-btns { display: flex; justify-content: flex-end; gap: 8px; }\n.cs-dlg-btns button { font: 12px var(--mono, system-ui); padding: 7px 14px; border-radius: 5px; border: 1px solid #333a48; background: #242936; color: var(--ink, #e6e9ef); cursor: pointer; }\n.cs-dlg-btns button:hover { border-color: var(--accent-line, rgba(240,160,32,.4)); }\n.cs-dlg-primary { background: var(--accent, #f0a020) !important; color: #1a1206 !important; border-color: var(--accent, #f0a020) !important; font-weight: 700; }\n\n/* ---- transport ease bar ---- */\n#easeBar { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line, #2c303a); }\n#easeBar .tbtn { font-size: 10px; padding: 3px 8px; }\n\n/* ---- playhead: grabbable along the WHOLE line, not just the top handle ---- */\n/* only the BRIGHT LINE edge of the playhead is grabbable — the translucent\n   body lets clicks through, so you can still grab a drawing's exposure\n   handle sitting under the playhead */\n#tlPlayhead { pointer-events: none; cursor: ew-resize; }\n/* The scrub grab strip is confined to the RULER. It used to run top:0;bottom:0,\n   i.e. the full height of the scrolled content at z-index 40, so it covered the\n   left 7px of the current frame's cell on EVERY row - 41% of a cell at the\n   default zoom, sitting exactly where an animator starts a selection. A drag\n   there scrubbed instead of selecting, and because scrubbing drags the playhead\n   to the pointer the strip stayed under the pointer for the whole gesture.\n   18px = the measured height of .cs-ruler (border-box, its 1px border included).\n   Scrubbing is unchanged on the ruler band, on this strip within it, and on the\n   arrow handle. */\n/* The playhead LINE is grabbable along its FULL height - that is how the\n   playhead has always been picked up and removing it (b177 briefly cut this\n   strip down to the ruler) made the playhead feel unselectable. The strip is\n   deliberately NARROW (6px hugging the 2px line, it was 9px starting 4px into\n   the neighbouring cell) so that starting a drag-select next to the playhead\n   still starts a drag-select; only a press right on the line scrubs. */\n#tlPlayhead .ph-grab { position: absolute; left: -2px; top: 0; bottom: 0; width: 6px; pointer-events: auto; cursor: ew-resize; }\n#tlPlayhead #tlPlayhandle { pointer-events: auto; }\n\n/* ---- grouped toolbars: node-add header + props panels ---- */\n.nd-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.nd-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 3px 7px 4px 8px; background: #151922; border: 1px solid #262b36; border-radius: 6px; }\n.nd-grp-l { font: 600 8.5px/1 ui-monospace, monospace; letter-spacing: 1.2px; text-transform: uppercase; color: #5a6272; margin-right: 4px; user-select: none; }\n.nd-add-btn .g { color: #7d8fa0; color: #8fa1b8; margin-right: 4px; font-size: 11px; }\n.pp-tb { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 2px; align-items: stretch; }\n.pp-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 7px 5px; background: #151922; border: 1px solid #262b36; border-radius: 6px; }\n.pp-gl { font: 600 8.5px/1 ui-monospace, monospace; letter-spacing: 1.1px; text-transform: uppercase; color: #5a6272; margin-right: 3px; user-select: none; }\n.pp-note { font: 600 8.5px/1 ui-monospace, monospace; letter-spacing: .6px; text-transform: uppercase; color: #d8a23c; user-select: none; }\n.pp-grp-danger { border-color: #4a2630; background: #1c1216; margin-left: auto; }\n.pp-grp-danger .pp-b:hover { background: #58212e; color: #ffb4c0; }\n#toolGrad svg { display: block; }\n\n/* ---- batch 15: save pill, brush library, label ranges, float button ---- */\n.save-ind {\n  display: inline-flex; align-items: center; gap: 6px;\n  margin-left: 6px; padding: 3px 10px 3px 8px;\n  background: #16191f; border: 1px solid var(--line); border-radius: 999px;\n  font: 10px/1.4 var(--mono, monospace); color: var(--ink-dim);\n  cursor: pointer; max-width: 250px; white-space: nowrap; overflow: hidden;\n}\n.save-ind:hover { border-color: #3a4152; color: var(--ink); }\n.save-ind .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7484; flex: none; }\n.save-ind.s-ok .save-dot { background: #35c26e; box-shadow: 0 0 5px rgba(53, 194, 110, .7); }\n.save-ind.s-dirty .save-dot { background: #f0a020; box-shadow: 0 0 5px rgba(240, 160, 32, .7); }\n.save-ind.s-saving .save-dot { background: #46c8d6; animation: csPulse 0.9s infinite; }\n.save-ind.s-off .save-dot { background: #6b7484; }\n.save-ind #saveTxt { overflow: hidden; text-overflow: ellipsis; }\n@keyframes csPulse { 50% { opacity: .35; } }\n\n#csBrushLib, #csBmLib {\n  position: fixed; z-index: 9999; width: 372px;\n  background: #181b22; border: 1px solid #333a48; border-radius: 10px;\n  box-shadow: 0 14px 40px rgba(0, 0, 0, .6);\n  font: 11px system-ui; color: #c8d0dc;\n  display: flex; flex-direction: column; overflow: hidden;\n}\n.cs-blib-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 8px; font-size: 12px; }\n.cs-blib-grid {\n  display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px;\n  padding: 2px 12px 10px; max-height: 380px; overflow: auto;\n}\n.cs-blib-sec { grid-column: 1 / -1; color: #7a8494; font: 600 9px system-ui; letter-spacing: .8px; text-transform: uppercase; margin-top: 4px; }\n.cs-bcard {\n  position: relative; display: flex; flex-direction: column; gap: 3px;\n  background: #10131a; border: 1px solid #2c303a; border-radius: 7px;\n  padding: 6px 7px; cursor: pointer;\n}\n.cs-bcard:hover { border-color: #46c8d6; }\n.cs-bcard.on { border-color: #46c8d6; background: #0f2126; }\n.cs-bcard canvas { width: 100%; height: 40px; display: block; }\n.cs-bcard span { font-size: 10px; color: #aab4c4; }\n.cs-bcard .cs-bdel {\n  position: absolute; top: 3px; right: 5px; color: #7a8494; font-weight: 400;\n  padding: 1px 4px; border-radius: 4px; display: none;\n}\n.cs-bcard:hover .cs-bdel { display: block; }\n.cs-bcard .cs-bdel:hover { color: #ff7d7d; background: #2a1a1f; }\n.cs-blib-foot { display: flex; gap: 6px; padding: 8px 12px 11px; border-top: 1px solid #242936; }\n\n.cs-rlabel.rng { border-radius: 4px 6px 6px 4px; opacity: .93; }\n.cs-rlabel.rng::after {\n  content: \"\"; position: absolute; right: 0; top: 0; bottom: 0; width: 7px;\n  border-right: 3px solid rgba(0, 0, 0, .45); border-radius: 0 6px 6px 0;\n  cursor: ew-resize;\n}\n.cs-rlabel:not(.rng)::after {\n  content: \"\"; position: absolute; right: -2px; top: 0; bottom: 0; width: 8px; cursor: ew-resize;\n}\n\n/* node dock header buttons — float + collapse share one quiet style */\n#ndFloat, #ndCollapse, #ndReset, #ndAlign {\n  background: none; border: 1px solid transparent; color: var(--ink-dim);\n  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;\n  font-size: 13px; line-height: 1; padding: 0;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n#ndFloat:hover, #ndCollapse:hover, #ndReset:hover, #ndAlign:hover { background: #242936; color: var(--ink); border-color: var(--line); }\n#ndFloat.active { color: #46c8d6; border-color: #2a5a62; background: #10262b; }\n\n#csArtHead:hover { background: #242936 !important; }\n\n.nd-node.msel { outline: 2px dashed #46c8d6; outline-offset: 2px; }\n\n/* ---- batch 12: locks, ghost keys, ruler labels ---- */\n.tl-lock {\n  flex: none; width: 18px; height: 18px; padding: 0; border: 0; background: none;\n  font-size: 10px; line-height: 1; cursor: pointer; color: var(--ink-dim);\n  opacity: .45; filter: grayscale(1);\n}\n.tl-lock:hover { opacity: .9; }\n.tl-lock.on { opacity: 1; filter: none; }\n.tl-row.tl-locked .tl-track { opacity: .55; }\n.tl-row.tl-locked .tl-name { color: #6b7484; text-decoration: none; font-style: italic; }\n#tlRows .tl-diamond.ghost {\n  background: #8a94a4; border-color: #565e6c; opacity: .55;\n  width: 8px; height: 8px;\n}\n#tlRows .tl-diamond.ghost.hold { background: transparent; border-color: #8a94a4; }\n#tlRows .tl-diamond.ghost.sel { background: #dfe5ee; border-color: #fff; opacity: .95; box-shadow: 0 0 6px 2px rgba(180, 195, 215, .7); }\n.cs-rlabel {\n  position: absolute; top: 0; z-index: 3;\n  font: 600 9px/1 var(--mono, monospace); color: #10131a;\n  padding: 2px 7px 2px 5px; border-radius: 0 6px 6px 0;\n  cursor: grab; user-select: none; white-space: nowrap;\n  box-shadow: 0 1px 4px rgba(0, 0, 0, .4);\n  border-left: 2px solid rgba(0, 0, 0, .55);\n  max-width: 120px; overflow: hidden; text-overflow: ellipsis;\n}\n.cs-rlabel:active { cursor: grabbing; }\n\n/* --- selected / keying layer: faint orange wash on its timeline row --- */\n#tlRows > .keyfocus,\n#tlRows .tl-row.keyfocus { background: rgba(240, 160, 32, 0.10) !important; }\n#tlRows > .keyfocus .tl-track { background: rgba(240, 160, 32, 0.05); }\n.cs-easeval { width: 44px; height: 24px; margin: 0 6px 0 2px; background: #11131a; color: #c8d0dc; border: 1px solid #333a48; border-radius: 4px; padding: 0 4px; font-size: 10px; }\n/* the selected node's NAME CARD lights up too — the row tint alone was easy\n   to miss on a tall timeline */\n#tlRows .tl-row.keyfocus .tl-head {\n  background: rgba(240, 160, 32, 0.22);\n  box-shadow: inset 3px 0 0 #f0a020;\n}\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n  <div id=\"workspace\">\n    <div id=\"topbar\">\n      <span class=\"topbar-logo\" title=\"Calder Studio\"><svg viewBox=\"126 126 828 828\" aria-label=\"Calder Studio\"><defs><linearGradient id=\"csLogoGrad\" x1=\"361.2\" y1=\"172.39\" x2=\"723.36\" y2=\"916.98\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#fbca17\"><\u002Fstop><stop offset=\"1\" stop-color=\"#efa021\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><rect x=\"126\" y=\"126\" width=\"828\" height=\"828\" rx=\"259.5\" ry=\"259.5\" fill=\"url(#csLogoGrad)\"><\u002Frect><path fill=\"#fff\" d=\"M459.07,789.63c-43.14,0-81.87-9.61-116.18-28.85-34.32-19.23-61.41-47.12-81.28-83.67-19.87-36.55-29.8-80.53-29.8-131.96s9.93-96.05,29.8-132.6c19.87-36.55,46.96-64.44,81.28-83.67,34.31-19.23,73.04-28.85,116.18-28.85,28.9,0,55.57,4.2,80.01,12.59,24.43,8.4,46,20.4,64.71,36.02,18.7,15.62,34,34.42,45.9,56.42,11.9,21.99,19.55,46.7,22.95,74.11h-115.39c-2.13-12.54-5.95-23.69-11.47-33.47-5.53-9.77-12.43-18.06-20.72-24.86-8.29-6.8-17.8-12-28.53-15.62-10.73-3.61-22.47-5.42-35.22-5.42-24.22,0-44.84,5.79-61.84,17.37-17,11.58-29.96,28.21-38.89,49.88s-13.39,47.71-13.39,78.09,4.46,56.37,13.39,77.93c8.92,21.57,21.88,38.09,38.89 Fbutton>\n        <button id=\"toolSlice\" class=\"ico\" title=\"Slice — click a line to trim it back to where it crosses another (C)\" data-pop=\"popSlice\">✂<\u002Fbutton>\n        <button id=\"toolGrad\" class=\"ico\" title=\"Gradient: drag across a fill to lay a gradient down, or drag an end handle to move it\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\"><defs><linearGradient id=\"gswIco\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"currentColor\"><\u002Fstop><stop offset=\"1\" stop-color=\"currentColor\" stop-opacity=\"0.15\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\" fill=\"url(#gswIco)\"><\u002Frect><\u002Fsvg><\u002Fbutton>\n        <button id=\"toolShape\" class=\"ico\" title=\"Shapes — rectangle / ellipse / polygon\" data-pop=\"popShape\">◱<\u002Fbutton>\n        <button id=\"toolErase\" class=\"ico\" title=\"Erase — hold E\" data-pop=\"popErase\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16.5 4.5l3 3a2 2 0 0 1 0 2.8L11 18.8H6.2l-2.7-2.7a2 2 0 0 1 0-2.8L13.7 4.5a2 2 0 0 1 2.8 0z\"><\u002Fpath><path d=\"M9 11l4 4\"><\u002Fpath><path d=\"M11 19h9\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"side-divider\"><\u002Fdiv>\n\n      <div class=\"side-group\">\n        <button id=\"btnBrushPanel\" class=\"ico\" title=\"Vector brush (N) — outline &amp; textured vector strokes; its presets live in the Vector brush library\" data-pop=\"popBrushPanel\">🖌<\u002Fbutton>\n        <button id=\"btnColor\" class=\"ico\" title=\"Color\" data-pop=\"popColor\">\n          <span class=\"swatch\" id=\"colorSwatch\"><\u002Fspan>\n        <\u002Fbutton>\n        <button id=\"btnArtBox\" class=\"ico\" title=\"Art layers: Overlay / Line art / Colour / Underlay panel, plus any you add\"><svg width=\"17\" hei
