OffPeg\" class=\"ico\" title=\"Off-peg this frame (nudge to trace, then peg back)\">⚓<\u002Fbutton>\n        <button id=\"btnOptimize\" class=\"ico\" title=\"Motion / vector export — send, sync &amp; optimize\" data-pop=\"popOptimize\" style=\"font:700 13px/1 system-ui;letter-spacing:.3px\">\\u2934<\u002Fbutton>\n        <button id=\"btnFile\" class=\"ico\" title=\"Save / load\" data-pop=\"popFile\">💾<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"side-spacer\"><\u002Fdiv>\n\n      <div class=\"side-group\">\n        <button id=\"btnKeys\" class=\"ico\" title=\"Customize keyboard shortcuts\">⌨<\u002Fbutton>\n        <button id=\"btnHelp\" class=\"ico\" title=\"Help &amp; shortcuts (H)\">?<\u002Fbutton>\n        <button id=\"btnFull\" class=\"ico\" title=\"Focus mode — just the canvas (Tab)\">⛶<\u002Fbutton>\n        <button id=\"btnSettings\" class=\"ico\" title=\"Settings (resolution, fps…)\" data-pop=\"popSettings\">⚙<\u002Fbutton>\n        <button id=\"btnRender\" class=\"ico send-ico\" title=\"Render / Export\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:block;margin:auto\"><path d=\"M9 11V2.5\"/><path d=\"M5.5 5.5 9 2l3.5 3.5\"/><path d=\"M3 10.5v3.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-3.5\"/><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <!-- ===== MAIN COLUMN ===== -->\n    <div class=\"main\">\n      <section class=\"stageWrap\" id=\"stageWrap\">\n        <div class=\"stageSizer\" id=\"stageSizer\">\n          <canvas id=\"stage\" tabindex=\"0\"><\u002Fcanvas>\n          <canvas id=\"pegOverlay\" hidden=\"\"><\u002Fcanvas>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- timeline + playback: the only full rows -->\n      <section class=\"transport\">\n        <button id=\"playBtn\" class=\"tbtn accent\" title=\"Play/stop (Space)\">▶<\u002Fbutton>\n        <button id=\"loopBtn\" class=\"tbtn active\" title=\"Loop\">↻<\u002Fbutton>\n        <button id=\"btnOverscan\" class=\"tbtn\" title=\"Overscan — show artwork outside the canvas\">⬚<\u002Fbutton>\n        <button id=\"btnHandles\" class=\"tbtn active\" title=\"Control handles on/off (K). Hides every on-canvas control marker at once. Each control keeps its own setting and icon for when you turn them back on.\">◎<\u002Fbutton>\n        <label class=\"ctl tiny play-fps\">\n          <input type=\"number\" id=\"playFps\" min=\"1\" max=\"60\" value=\"24\"><span>fps<\u002Fspan>\n        <\u002Flabel>\n        <button id=\"prevFrame\" class=\"tbtn\" title=\"Previous (,)\">⏮<\u002Fbutton>\n        <button id=\"nextFrame\" class=\"tbtn\" title=\"Next (.)\">⏭<\u002Fbutton>\n        <span class=\"zoomCtl\" title=\"Zoom\">\n          <button id=\"zoomOut\" class=\"tbtn\" title=\"Zoom out (1)\">－<\u002Fbutton>\n          <input type=\"range\" id=\"zoomSlider\" min=\"20\" max=\"800\" value=\"100\" title=\"Zoom\">\n          <button id=\"zoomIn\" class=\"tbtn\" title=\"Zoom in (2)\">＋<\u002Fbutton>\n          <button id=\"zoomReset\" class=\"zoomPct\" title=\"Reset zoom (0)\">100%<\u002Fbutton>\n        <\u002Fspan>\n        <span class=\"frameCounter\"><b id=\"frameNum\">1<\u002Fb>/<span id=\"frameTotal\">1<\u002Fspan><\u002Fspan>\n        <button id=\"newFrame\" class=\"tbtn accent\" title=\"New blank (N)\">＋<\u002Fbutton>\n        <button id=\"dupFrame\" class=\"tbtn\" title=\"Duplicate (D)\">⧉<\u002Fbutton>\n        <button id=\"delFrame\" class=\"tbtn danger\" title=\"Delete\">🗑<\u002Fbutton>\n        <button id=\"btnMakeKeys\" class=\"tbtn\" title=\"Create keyframes — re-key the selected range on 2s / 3s / 4s (keeps the motion)\">◆2s<\u002Fbutton>\n        <button id=\"btnPasteRev\" class=\"tbtn\" title=\"Paste reversed — paste the copied keys (Ctrl+C) with their timing reversed, at the playhead\">◆◀<\u002Fbutton>\n        <button id=\"btnOffsetLoop\" class=\"tbtn\" title=\"Offset loop — rotate the selected loop's keys in time (default 2 frames = one cel on 2s) so its cycle runs offset from the rest\">◆↻<\u002Fbutton>\n        <span class=\"easeBar\" id=\"easeBar\" title=\"Acts on the selected control/warp's keys\">\n          <button id=\"easeInBtn\" class=\"tbtn\" title=\"Ease in\">Ease In<\u002Fbutton><input type=\"number\" id=\"easeInVal\" class=\"cs-easeval\" min=\"0\" max=\"100\" title=\"Ease-in % (Enter applies)\">\n          <button id=\"easeOutBtn\" class=\"tbtn\" title=\"Ease out\">Ease Out<\u002Fbutton><input type=\"number\" id=\"easeOutVal\" class=\"cs-easeval\" min=\"0\" max=\"100\" title=\"Ease-out % (Enter applies)\">\n          <button id=\"easyEaseBtn\" class=\"tbtn\" title=\"Quick ease: the key's segment eases both sides\">Quick Ease<\u002Fbutton><input type=\"number\" id=\"easyEaseVal\" class=\"cs-easeval\" min=\"0\" max=\"100\" title=\"Quick-ease % (Enter applies)\">\n          <button id=\"anchorGridBtn\" class=\"tbtn\" title=\"Set the anchor / pivot point\">▦ Anchor<\u002Fbutton>\n          <button id=\"keyExpoLinkBtn\" class=\"tbtn\" title=\"Frames follow keys: while a control is COLLAPSED, dragging its keys carries the drawings sitting on those frames along with them\">⇄ Frames follow keys<\u002Fbutton>\n        <\u002Fspan>\n        <!-- selection mini-toolbar: sits at the right of the transport row so it\n             never covers the timeline. Hidden until something is selected. -->\n        <span class=\"selBar\" id=\"selBar\" hidden=\"\">\n          <span id=\"selCount\">0 selected<\u002Fspan>\n          <button id=\"selDelete\" class=\"tbtn danger\" title=\"Delete selection\">delete<\u002Fbutton>\n          <button id=\"selClear\" class=\"tbtn\" title=\"Deselect\">deselect<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Fsection>\n\n      <!-- multi-track timeline: one row per layer, resizable height -->\n      <section class=\"timeline\" id=\"timeline\">\n        <div class=\"tl-resize\" id=\"tlResize\" title=\"Drag to resize timeline\"><\u002Fdiv>\n        <div class=\"tl-scroll\" id=\"tlScroll\">\n          <div class=\"tl-rows\" id=\"tlRows\"><\u002Fdiv>\n          <div id=\"tlPlayhead\" hidden=\"\"><div class=\"ph-grab\" title=\"Drag to scrub\"><\u002Fdiv><div id=\"tlPlayhandle\" title=\"Drag to scrub\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tl-foot\">\n          <button id=\"layerAdd\" class=\"tbtn\" title=\"Add layer\">＋ layer<\u002Fbutton>\n          <button id=\"layerColor\" class=\"tbtn\" title=\"Add a colour sub-layer for the active layer\" style=\"display:none\">＋ colour<\u002Fbutton>\n          <button id=\"layerDel\" class=\"tbtn danger\" title=\"Delete active layer\">🗑 layer<\u002Fbutton>\n          <span class=\"tl-hint\">drag a frame's right edge to set its exposure · drag a frame to reorder · double-click the ruler for a label · drag a label's right edge to stretch it<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <!-- ===== POPOUTS (anchored, hidden until opened) ===== -->\n    <div class=\"popout\" id=\"popBrush\" hidden=\"\">\n      <div class=\"pop-head\">pencil <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl check\" title=\"Guide ink: bounds fills like a normal line but never renders — shows as a dashed cyan hairline on the canvas only\"><input type=\"checkbox\" id=\"pencilInvisible\"> <span>invisible stroke (fill guide, never renders)<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"showGuides\" checked=\"\"> <span>show guide strokes on canvas<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\" title=\"Draw-over-line: when a line crosses another line (or loops over itself) a shared vertex is dropped at the crossing so they join as one editable path. Also fires when you drag a line onto another.\"><input type=\"checkbox\" id=\"autoWeld\" checked=\"\"> <span>join crossing lines (shared vertex)<\u002Fspan><\u002Flabel>\n      <div class=\"brush-presets\" id=\"brushPresets\">\n        <button class=\"bp\" data-preset=\"pencil\" title=\"Rough graphite tooth\">✏ Pencil<\u002Fbutton>\n        <button class=\"bp\" data-preset=\"charcoal\" title=\"Coarse, grainy\">▓ Charcoal<\u002Fbutton>\n        <button class=\"bp active\" data-preset=\"ink\" title=\"Smooth clean variable-width line\">✒ Ink<\u002Fbutton>\n        <button class=\"bp\" data-preset=\"bumpyink\" title=\"Variable-width ink with a rough, bumpy edge\">〜 Bumpy Ink<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl\">\n        <span>mode<\u002Fspan>\n        <select id=\"brushMode\">\n          <option value=\"centerline\">centerline (uniform)<\u002Foption>\n          <option value=\"variable\" selected=\"\">variable width (pressure)<\u002Foption>\n        <\u002Fselect>\n      <\u002Flabel>\n      <label class=\"ctl slider\"><span>size <b id=\"sizeVal\">8<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"size\" min=\"1\" max=\"80\" value=\"8\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>opacity <b id=\"opacityVal\">100<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"opacity\" min=\"1\" max=\"100\" value=\"100\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>smoothing <b id=\"tensionVal\">0.5<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"tension\" min=\"0\" max=\"100\" value=\"50\"><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"roundCap\" checked=\"\"> <span>rounded ends<\u002Fspan><\u002Flabel>\n      <div id=\"varRow\">\n        <label class=\"ctl slider\"><span>min width <b id=\"minWidthVal\">15<\u002Fb>%<\u002Fspan>\n          <input type=\"range\" id=\"minWidth\" min=\"0\" max=\"90\" value=\"15\"><\u002Flabel>\n        <label class=\"ctl check\"><input type=\"checkbox\" id=\"taper\"> <span>1-stroke taper<\u002Fspan><\u002Flabel>\n      <\u002Fdiv>\n      <div id=\"outlineRow\" hidden=\"\">\n        <label class=\"ctl slider\"><span>pressure <b id=\"thinningVal\">0.6<\u002Fb><\u002Fspan>\n          <input type=\"range\" id=\"thinning\" min=\"0\" max=\"100\" value=\"60\"><\u002Flabel>\n        <label class=\"ctl slider\"><span>min width <b id=\"minWidthOutVal\">0<\u002Fb>%<\u002Fspan>\n          <input type=\"range\" id=\"minWidthOut\" min=\"0\" max=\"90\" value=\"0\"><\u002Flabel>\n        <p class=\"hint\">Bakes a filled outline. <b>pressure<\u002Fb> sets how much the line thins as you ease off; <b>rounded ends<\u002Fb> softens the tips.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popBrushPanel\" hidden=\"\">\n      <div class=\"pop-head\">brush <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl slider\"><span>max thickness <b id=\"bpMaxVal\">14<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"bpMax\" min=\"1\" max=\"120\" value=\"14\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>min thickness <b id=\"bpMinVal\">12<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"bpMin\" min=\"0\" max=\"100\" value=\"12\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>smoothing <b id=\"bpSmoothVal\">0.5<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"bpSmooth\" min=\"0\" max=\"100\" value=\"50\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>taper in <b id=\"bpTinVal\">0<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"bpTin\" min=\"0\" max=\"100\" value=\"0\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>taper out <b id=\"bpToutVal\">0<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"bpTout\" min=\"0\" max=\"100\" value=\"0\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>soft edge <b id=\"bpSoftVal\">0<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"bpSoft\" min=\"0\" max=\"24\" value=\"0\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>opacity <b id=\"bpOpVal\">100<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"bpOp\" min=\"1\" max=\"100\" value=\"100\"><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"bpRound\" checked=\"\"> <span>rounded ends<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\" title=\"Draw-over-line: when a line crosses another line (or loops over itself) a shared vertex is dropped at the crossing so they join as one editable path. Also fires when you drag a line onto another.\"><input type=\"checkbox\" id=\"autoWeldBp\" checked=\"\"> <span>join crossing lines (shared vertex)<\u002Fspan><\u002Flabel>\n      <p class=\"hint\">Pressure drives thickness between <b>min<\u002Fb> and <b>max<\u002Fb>. <b>Taper<\u002Fb> points the ends; <b>soft edge<\u002Fb> feathers the outline; <b>smoothing<\u002Fb> steadies the line. Strokes stay editable as outline vectors.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popColor\" hidden=\"\">\n      <div class=\"pop-head\">color <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <!-- full-spectrum HSV picker (no native widget / OS eyedropper, so it\n           works reliably inside CEP). SV square + hue strip + hex field. -->\n      <div class=\"cp\">\n        <canvas id=\"cpSV\" class=\"cp-sv\" width=\"220\" height=\"150\"><\u002Fcanvas>\n        <canvas id=\"cpHue\" class=\"cp-hue\" width=\"220\" height=\"14\"><\u002Fcanvas>\n        <div class=\"cp-row\">\n          <span class=\"cp-preview\" id=\"cpPreview\"><\u002Fspan>\n          <input type=\"text\" id=\"colorHex\" class=\"cp-hex\" maxlength=\"7\" placeholder=\"#1a1a1f\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"hint foldable\" tabindex=\"0\" title=\"Drag in the square for shade, the strip for hue — or type a hex code. The 💧 eyedropper tool lifts colours from the canvas.\">Drag in the square for shade, the strip for hue — or type a hex code. The 💧 eyedropper tool lifts colours from the canvas.<\u002Fp>\n      <!-- multi-stop gradient editor: build it here, then fill with it or save it\n           to the palette next to your solid colours -->\n      <div class=\"cs-grad\" id=\"gradEd\">\n        <span class=\"cs-plabel\">gradient<\u002Fspan>\n        <div class=\"cs-grow\">\n          <button class=\"chip on\" id=\"gradTypeOff\" title=\"Fill with a flat colour\">off<\u002Fbutton>\n          <button class=\"chip\" id=\"gradTypeLinear\" title=\"Fill with a gradient that runs in a straight line\">linear<\u002Fbutton>\n          <button class=\"chip\" id=\"gradTypeRadial\" title=\"Fill with a gradient that spreads out from a centre\">radial<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"grad-rail\">\n          <div class=\"grad-bar\" id=\"gradBar\"><\u002Fdiv>\n          <div class=\"grad-stops\" id=\"gradStops\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cs-grow\">\n          <input type=\"color\" class=\"grad-swatch\" id=\"gradStopColor\" value=\"#4a90d9\" title=\"Colour of the stop you have picked\">\n          <input type=\"range\" id=\"gradStopPos\" min=\"0\" max=\"100\" value=\"100\" style=\"flex:1;min-width:0\" title=\"Slide the picked stop along the strip\">\n          <input type=\"number\" id=\"gradStopAlpha\" min=\"0\" max=\"100\" step=\"1\" value=\"100\" style=\"width:52px;flex:none\" title=\"See-through: 100 is solid, 0 is invisible\">\n          <button class=\"cs-padd\" id=\"gradAdd\" title=\"Add another colour (up to 5)\">+<\u002Fbutton>\n          <button class=\"cs-padd\" id=\"gradDel\" title=\"Remove the stop you have picked\">−<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"cs-grow\">\n          <button class=\"chip\" id=\"gradSave\" style=\"flex:1\" title=\"Save this gradient into the palette below, next to your solid colours\">save to palette<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"hint tiny foldable\" tabindex=\"0\" title=\"Click a stop to pick it, drag it along the strip to move it, up to 5 colours. With linear or radial on, the bucket fills with this gradient. To aim one on the artwork, take the gradient tool and drag across the fill.\">Click a stop to pick it, drag it along the strip to move it, up to 5 colours. With linear or radial on, the bucket fills with this gradient. To aim one on the artwork, take the gradient tool and drag across the fill.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popFill\" hidden=\"\">\n      <div class=\"pop-head\">fill <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <p class=\"hint\">Click inside an enclosed area to fill it (or click an existing fill to recolour it). The fill grows under the lines so there's no gap. Pick a <b>gap tolerance<\u002Fb> below if your linework has small breaks the fill leaks through.<\u002Fp>\n      <label class=\"ctl\"><span>fill style<\u002Fspan><\u002Flabel>\n      <div class=\"row\"><button class=\"chip on\" id=\"fillTypeSolid\">solid<\u002Fbutton><button class=\"chip\" id=\"fillTypeLinear\">linear<\u002Fbutton><button class=\"chip\" id=\"fillTypeRadial\">radial<\u002Fbutton><\u002Fdiv>\n      <p class=\"hint tiny\">The colours a gradient runs through are set in the <b>colour<\u002Fb> box, where you can build one with up to 5 colours and save it to the palette. To aim a gradient on the artwork, take the gradient tool and drag across the fill; a fill you have selected with the transform tool shows the same two round end handles.<\u002Fp>\n      <label class=\"ctl\"><span>gap tolerance<\u002Fspan>\n        <select id=\"fillGapLevel\">\n          <option value=\"strict\">only if fully enclosed<\u002Foption>\n          <option value=\"0\" selected=\"\">none<\u002Foption>\n          <option value=\"6\">small gaps<\u002Foption>\n          <option value=\"14\">medium gaps<\u002Foption>\n          <option value=\"26\">large gaps<\u002Foption>\n        <\u002Fselect>\n      <\u002Flabel>\n      <p class=\"hint tiny\">\"Only if fully enclosed\" refuses to fill when there's any break in the outline — useful to catch gaps you can't see. The gap levels bridge progressively bigger breaks; if a fill bleeds out, drop to a smaller level.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popSelect\" hidden=\"\">\n      <div class=\"pop-head\">select <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"selSameColor\"> <span>selecting a stroke selects everything with its colour<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\" title=\"While dragging a selection, its line ENDPOINTS snap onto nearby vertices of other strokes — perfect for butting limb pieces up against joints\"><input type=\"checkbox\" id=\"selSnapVtx\"> <span>snap to vertices while moving<\u002Fspan><\u002Flabel>\n      <p class=\"hint\">Lasso around artwork to select it. With the colour option on, picking one stroke also grabs every stroke and fill of the same colour in the drawing. With snap on, a dragged selection clicks onto nearby points of other lines.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popContour\" hidden=\"\">\n      <div class=\"pop-head\">contour editor <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl check\" title=\"Show pink width handles at every vertex. Drag a handle to taper (narrow) or expand (widen) the line at that point.\"><input type=\"checkbox\" id=\"contourWidthEdit\"> <span>edit line width at vertices<\u002Fspan><\u002Flabel>\n      <p class=\"hint\">Click a line to edit it. Drag the orange squares to move points, the cyan dots to bend the curve. Turn on <b>width<\u002Fb> to get pink handles at each vertex — drag them out to fatten the line or in to taper it (drag to a point for a needle tip). <b>Shift<\u002Fb>-drag sets the same width across every selected vertex.<\u002Fp>\n      <button id=\"contourWidthReset\" class=\"btn\">reset to even width<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popShape\" hidden=\"\">\n      <div class=\"pop-head\">shapes <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <div class=\"row\" id=\"shapeKindRow\" style=\"display:flex;flex-wrap:wrap;gap:4px;max-width:266px\">\n        <button class=\"chip on\" data-shape=\"rect\">▭ rectangle<\u002Fbutton>\n        <button class=\"chip\" data-shape=\"circle\">◯ ellipse<\u002Fbutton>\n        <button class=\"chip\" data-shape=\"guide\" title=\"Rigging guide — a circle with a dot at its exact centre\">◎ guide circle<\u002Fbutton>\n        <button class=\"chip\" data-shape=\"limb\" title=\"Rigging limb — two perfect circles joined by a box; on release only the outer outline and the two centre dots remain\">▱ limb<\u002Fbutton>\n        <button class=\"chip\" data-shape=\"poly\">⬠ polygon<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl tiny\" id=\"shapeSidesRow\" hidden=\"\"><span>points<\u002Fspan>\n        <input type=\"number\" id=\"shapeSides\" min=\"3\" max=\"24\" value=\"5\"><\u002Flabel>\n      <label class=\"ctl slider\"><span>corner roundness <b id=\"shapeRoundVal\">0<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"shapeRound\" min=\"0\" max=\"100\" value=\"0\"><\u002Flabel>\n      <p class=\"hint\">Drag on the canvas to draw with the current pencil / brush. Hold <b>Shift<\u002Fb> for a perfect square or circle. Shapes erase and edit like any stroke.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popSlice\" hidden=\"\">\n      <div class=\"pop-head\">slice / trim <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl check\" title=\"When a clicked line has NO crossing with another line, delete the whole line. Off (default): the line is left alone and a message says no crossing was found.\"><input type=\"checkbox\" id=\"sliceDeleteWhole\"> <span>delete whole line when it has no crossing<\u002Fspan><\u002Flabel>\n      <p class=\"hint\">Click a line — the clicked span is trimmed back to where it crosses another line. With no crossing found, nothing is removed unless the option above is on.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popErase\" hidden=\"\">\n      <div class=\"pop-head\">eraser <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl tiny\"><span>size<\u002Fspan>\n        <input type=\"number\" id=\"eraserSize\" min=\"2\" max=\"120\" value=\"16\"><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"eraserPressure\"> <span>pen pressure controls size<\u002Fspan><\u002Flabel>\n      <p class=\"hint\">Hold <b>E<\u002Fb> to erase, release to return to your tool. Splits paths.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popOnion\" hidden=\"\">\n      <div class=\"pop-head\">onion skin <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <div class=\"row onion-row\">\n        <button id=\"onionPrev\" class=\"chip prev on\">◄ prev<\u002Fbutton>\n        <button id=\"onionNext\" class=\"chip next on\">next ►<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"row\" style=\"gap:6px\">\n        <label class=\"ctl tiny\" title=\"How many ghosts BEFORE the playhead\"><span>prev count<\u002Fspan>\n          <input type=\"number\" id=\"onionRangePrev\" min=\"1\" max=\"6\" value=\"1\" style=\"width:44px\"><\u002Flabel>\n        <label class=\"ctl tiny\" title=\"How many ghosts AFTER the playhead\"><span>next count<\u002Fspan>\n          <input type=\"number\" id=\"onionRangeNext\" min=\"1\" max=\"6\" value=\"1\" style=\"width:44px\"><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"row\" style=\"gap:6px\">\n        <label class=\"ctl tiny\" title=\"Opacity of prev ghosts\"><span>prev opacity<\u002Fspan>\n          <input type=\"range\" id=\"onionOpPrev\" min=\"5\" max=\"100\" value=\"45\" style=\"width:70px\"><\u002Flabel>\n        <label class=\"ctl tiny\" title=\"Opacity of next ghosts\"><span>next opacity<\u002Fspan>\n          <input type=\"range\" id=\"onionOpNext\" min=\"5\" max=\"100\" value=\"45\" style=\"width:70px\"><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"row\" title=\"by frames — ghost N timeline frames either side (a held drawing may ghost as itself); by drawings — cel light-table: ghost the previous / next DISTINCT drawings however long each is held\">\n        <button id=\"onionModeFrames\" class=\"chip on\">by frames<\u002Fbutton>\n        <button id=\"onionModeDraw\" class=\"chip\">by drawings<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl tiny\" title=\"Ghosts are clipped by their Mask nodes, so masked art doesn't ghost its full shape\"><span>respect masks<\u002Fspan>\n        <input type=\"checkbox\" id=\"onionMask\" checked=\"\"><\u002Flabel>\n      <label class=\"ctl tiny\" title=\"When the camera pans or zooms between frames, line the onion ghosts up with the CURRENT frame's camera view instead of letting them drift with the camera\"><span>follow camera<\u002Fspan>\n        <input type=\"checkbox\" id=\"onionCamFollow\"><\u002Flabel>\n      <div class=\"row\"><button id=\"onionOff\" class=\"chip\">⭘ turn off<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popRef\" hidden=\"\">\n      <div class=\"pop-head\">reference image <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <button id=\"refImport\" class=\"btn\">import image as layer…<\u002Fbutton>\n      <p class=\"hint\">Brings an image in as its own timeline layer. Select it with the ⬚ tool to move, scale, or rotate it like any drawing, give it frames, and set its exposure. Import more than once for multiple references.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popGuides\" hidden=\"\">\n      <div class=\"pop-head\">guides &amp; layout <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"guideGrid\"> <span>show grid<\u002Fspan><\u002Flabel>\n      <label class=\"ctl slider\"><span>grid size <b id=\"guideGridVal\">80<\u002Fb>px<\u002Fspan>\n        <input type=\"range\" id=\"guideGridSize\" min=\"16\" max=\"240\" value=\"80\"><\u002Flabel>\n      <div class=\"pop-divider\"><\u002Fdiv>\n      <div class=\"row\" style=\"display:flex;flex-wrap:wrap;gap:4px;max-width:266px\">\n        <span class=\"hint\" style=\"width:100%;margin:0 0 2px\">Perspective points<\u002Fspan>\n        <button class=\"chip on\" data-persp=\"0\">off<\u002Fbutton>\n        <button class=\"chip\" data-persp=\"1\">1-point<\u002Fbutton>\n        <button class=\"chip\" data-persp=\"2\">2-point<\u002Fbutton>\n        <button class=\"chip\" data-persp=\"3\">3-point<\u002Fbutton>\n        <button class=\"chip\" data-persp=\"4\">4-point<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl slider\"><span>perspective density <b id=\"guideRaysVal\">16<\u002Fb> lines<\u002Fspan>\n        <input type=\"range\" id=\"guideRays\" min=\"4\" max=\"48\" value=\"16\"><\u002Flabel>\n      <label class=\"ctl slider\" title=\"The empty band the lines leave hugging the horizon. 0% closes it, so each wedge of lines runs right up to the horizon; 100% is the band the app has always drawn; above that opens it out, which reads as a higher ceiling in a two point interior.\"><span>centre gap <b id=\"guideGapVal\">100<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"guideGap\" min=\"0\" max=\"200\" value=\"100\"><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"guideSnap\"> <span>snap straight lines to guides<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\" title=\"Turn on, then drag the numbered dots on the canvas. A point parked off the page keeps its dot on the edge of what you can see, with an arrow pointing out at it.\"><input type=\"checkbox\" id=\"guideEdit\"> <span>move vanishing points<\u002Fspan><\u002Flabel>\n      <div class=\"row\"><button id=\"guideReset\" class=\"chip\">⭘ reset points<\u002Fbutton><\u002Fdiv>\n      <div class=\"row\" id=\"guideVpRow\" style=\"display:flex;flex-wrap:wrap;gap:4px;max-width:266px\">\n        <span class=\"hint\" style=\"width:100%;margin:0 0 2px\">Shape one point's lines<\u002Fspan>\n      <\u002Fdiv>\n      <label class=\"ctl slider\" title=\"0% spreads this point's lines evenly all the way round it, like a printed radial grid. 100% crowds them into the horizon.\"><span>line bunching <b id=\"guideBiasVal\">100<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"guideBias\" min=\"0\" max=\"100\" value=\"100\"><\u002Flabel>\n      <label class=\"ctl slider\" title=\"Tips this point's whole family of lines over, for a tilted horizon or a dutch angle\"><span>fan tilt <b id=\"guideRotVal\">0<\u002Fb>°<\u002Fspan>\n        <input type=\"range\" id=\"guideRot\" min=\"-180\" max=\"180\" value=\"0\"><\u002Flabel>\n      <p class=\"hint tiny\">Pick a point, then shape its lines. <b>Line bunching<\u002Fb> at 100% is the old look: lines crowd into the horizon and thin out near the camera. Wind it down and they spread out until, at 0%, they are evenly spaced the whole way round the point, which is what makes a point parked far off the page readable. <b>Fan tilt<\u002Fb> tips that one point's lines over.<\u002Fp>\n      <div class=\"pop-divider\"><\u002Fdiv>\n      <label class=\"ctl check\" title=\"The anime paper layout: field frame, safe action area, header strip and Acme peg holes\"><input type=\"checkbox\" id=\"guideAnime\"> <span>anime layout sheet<\u002Fspan><\u002Flabel>\n      <p class=\"hint tiny\">A4 landscape at 192 DPI (2245 × 1587): a 1920 × 1080 field frame, a 1728 × 972 safe action area, an EPISODE / CUT / TIMING header strip and Acme registration pegs. It fits itself to whatever canvas the scene has.<\u002Fp>\n      <div class=\"row\"><button id=\"guideAnimeRes\" class=\"chip\" title=\"Set the scene canvas to 2245 × 1587 so the sheet sits at its true size\">⤢ set canvas to 2245 × 1587<\u002Fbutton><\u002Fdiv>\n      <div class=\"pop-divider\"><\u002Fdiv>\n      <label class=\"ctl check\" title=\"Social media crop guide: the 1:1 square with the 16:9 landscape and 9:16 portrait crops marked\"><input type=\"checkbox\" id=\"guideSocial\"> <span>social media layout<\u002Fspan><\u002Flabel>\n      <p class=\"hint tiny\">For a 1:1 (square) master. Marks the square frame plus the 16:9 landscape crop (green rules) and the 9:16 portrait crop (magenta rules), each centred, so a frame that works inside all three travels to every platform. On a non-square canvas it centres the largest square that fits.<\u002Fp>\n      <div class=\"row\"><button id=\"guideSocialRes\" class=\"chip\" title=\"Set the scene canvas to a 1080 × 1080 square\">⤢ set canvas to 1080 × 1080<\u002Fbutton><\u002Fdiv>\n      <div class=\"pop-divider\"><\u002Fdiv>\n      <label class=\"ctl slider\"><span>guide line opacity <b id=\"guideOpVal\">100<\u002Fb>%<\u002Fspan>\n        <input type=\"range\" id=\"guideOpacity\" min=\"5\" max=\"100\" value=\"100\"><\u002Flabel>\n      <p class=\"hint\">Guides are a drawing aid only and never render into your export. Turn on <b>move vanishing points<\u002Fb>, then drag the dots on the canvas. Hold <b>Shift<\u002Fb> while drawing to snap a straight line to the nearest guide.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popOptimize\" hidden=\"\">\n      <div class=\"pop-head\">motion export <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <div class=\"row\"><button id=\"aeJson2\" class=\"chip\" title=\"Save the scene as celstudio_ae.json — import it into your compositing app with the importer script\">⤤ export motion JSON<\u002Fbutton><button id=\"aeJsx2\" class=\"chip\" title=\"Download the importer script — install once, then File → Scripts → Run Script File… in your compositing app\">⤤ Motion importer (.jsx)<\u002Fbutton><\u002Fdiv>\n      <p class=\"hint tiny\">1. Export the JSON. &nbsp;2. In your compositing app: <b>File → Scripts → Run Script File… → celstudio_import.jsx<\u002Fb>, then pick the JSON — it rebuilds every frame as native shape layers.<\u002Fp>\n      <div class=\"pop-divider\"><\u002Fdiv>\n      <label class=\"ctl tiny\"><span>default hold<\u002Fspan>\n        <input type=\"number\" id=\"frameDuration\" min=\"1\" value=\"2\"><span>f<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"atPlayhead\" checked=\"\"> <span>at playhead<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"flatten\"> <span>fast send (flattened)<\u002Fspan><\u002Flabel>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"aeBake\" checked=\"\"> <span>bake rig motion (pegs / camera → frames)<\u002Fspan><\u002Flabel>\n      <p class=\"hint tiny\" hidden=\"\">Bake evaluates your peg and camera animation — AND deformer warps — and writes them into each frame's vector points, so the host receives plain animated artwork; rigs themselves don't exist there.<\u002Fp>\n      <button id=\"send\" class=\"btn primary\" hidden=\"\">push to host →<\u002Fbutton>\n      <div class=\"pop-divider\" hidden=\"\"><\u002Fdiv>\n      <button id=\"pullFromAE\" class=\"btn\" hidden=\"\">← pull from host<\u002Fbutton>\n      <div class=\"pop-divider\" hidden=\"\"><\u002Fdiv>\n      <p class=\"hint\">optimize · current frame: <b id=\"vtxNow\">0<\u002Fb> vertices<\u002Fp>\n      <label class=\"ctl slider\"><span>simplify <b id=\"simpVal\">2.5<\u002Fb><\u002Fspan>\n        <input type=\"range\" id=\"simpTol\" min=\"0.5\" max=\"12\" step=\"0.5\" value=\"2.5\"><\u002Flabel>\n      <div class=\"row btns\">\n        <button id=\"simpFrame\" class=\"btn\">this frame<\u002Fbutton>\n        <button id=\"simpAll\" class=\"btn\">all frames<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl check\"><input type=\"checkbox\" id=\"collapseOne\"> <span>send as ONE layer<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popFile\" hidden=\"\">\n      <div class=\"pop-head\">save / load <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <button id=\"saveSession\" class=\"btn\">save .celae<\u002Fbutton>\n      <button id=\"loadSession\" class=\"btn\">load .celae<\u002Fbutton>\n      <input type=\"file\" id=\"loadFile\" accept=\".celae,.drawae,.json\" hidden=\"\">\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popSettings\" hidden=\"\">\n      <div class=\"pop-head\">settings <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl\"><span>resolution<\u002Fspan>\n        <select id=\"setRes\">\n          <option value=\"1920x1080\">1920 × 1080 (HD 16:9)<\u002Foption>\n          <option value=\"1280x720\">1280 × 720 (HD 16:9)<\u002Foption>\n          <option value=\"3840x2160\">3840 × 2160 (4K UHD)<\u002Foption>\n          <option value=\"2048x1152\">2048 × 1152 (2K 16:9)<\u002Foption>\n          <option value=\"1080x1080\">1080 × 1080 (square)<\u002Foption>\n          <option value=\"1080x1920\">1080 × 1920 (vertical 9:16)<\u002Foption>\n          <option value=\"2245x1587\">2245 × 1587 (anime A4 landscape, 192 DPI)<\u002Foption>\n          <option value=\"custom\">custom…<\u002Foption>\n        <\u002Fselect>\n      <\u002Flabel>\n      <div class=\"ctl\" id=\"setCustomRow\" hidden=\"\" style=\"gap:6px\">\n        <input type=\"number\" id=\"setW\" min=\"16\" max=\"8192\" step=\"1\" style=\"width:70px\" placeholder=\"width\">\n        <span style=\"opacity:.6\">×<\u002Fspan>\n        <input type=\"number\" id=\"setH\" min=\"16\" max=\"8192\" step=\"1\" style=\"width:70px\" placeholder=\"height\">\n        <button class=\"pp-b\" id=\"setApplyRes\">Apply<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"ctl tiny\" title=\"Off (default): artwork keeps its shape — it scales uniformly and is centred on the new canvas. On: everything is stretched per-axis to follow the new aspect ratio.\">\n        <input type=\"checkbox\" id=\"setResStretch\"> <span>stretch artwork to the new aspect ratio<\u002Fspan>\n      <\u002Flabel>\n      <label class=\"ctl tiny\"><span>default frame rate<\u002Fspan>\n        <input type=\"number\" id=\"setFps\" min=\"1\" max=\"60\" value=\"24\" style=\"width:64px\"><span class=\"cs-muted\">fps<\u002Fspan><\u002Flabel>\n      <label class=\"ctl\"><span>background<\u002Fspan>\n        <select id=\"setBg\">\n          <option value=\"#f4f2ec\">paper (light)<\u002Foption>\n          <option value=\"#ffffff\">white<\u002Foption>\n          <option value=\"#11131a\">dark<\u002Foption>\n          <option value=\"transparent\">transparent (checker)<\u002Foption>\n        <\u002Fselect>\n      <\u002Flabel>\n      <label class=\"ctl\"><span>timeline<\u002Fspan><\u002Flabel>\n      <div class=\"row\"><button class=\"chip\" id=\"tlPosTop\">⬆ top<\u002Fbutton><button class=\"chip on\" id=\"tlPosBottom\">⬇ bottom<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl\"><span>play bar<\u002Fspan><\u002Flabel>\n      <div class=\"row\"><button class=\"chip\" id=\"tpPosTop\">⬆ top<\u002Fbutton><button class=\"chip on\" id=\"tpPosBottom\">⬇ bottom<\u002Fbutton><\u002Fdiv>\n      <label class=\"ctl\"><span>peg tags<\u002Fspan>\n        <input type=\"text\" id=\"setPegTags\" placeholder=\"custom, comma, separated\" style=\"flex:1\"><\u002Flabel>\n      <label class=\"ctl\" title=\"On a pen tablet or iPad, the Apple Pencil counts as a pen and your hand/palm as touch. Choose whether finger &amp; palm touches are allowed to draw (palm rejection).\"><span>pen input<\u002Fspan>\n        <select id=\"setPenInput\">\n          <option value=\"auto\">Auto — ignore finger once Pencil used<\u002Foption>\n          <option value=\"pen\">Apple Pencil only (ignore finger &amp; palm)<\u002Foption>\n          <option value=\"all\">Allow finger &amp; palm to draw<\u002Foption>\n        <\u002Fselect>\n      <\u002Flabel>\n      <p class=\"hint\">Resolution resizes the canvas and rescales your existing artwork to fit. Frame rate is the default for playback and new renders. Peg tags appear as suggestions when you double-click a peg's name in the timeline. <b>Pen input<\u002Fb> is palm rejection for iPad / pen tablets: on <b>Auto<\u002Fb>, once you draw with the Apple Pencil your resting hand stops making marks.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"popout\" id=\"popSend\" hidden=\"\">\n      <div class=\"pop-head\">motion export sync <button class=\"pop-x\" data-close=\"\">✕<\u002Fbutton><\u002Fdiv>\n      <div class=\"row\"><button id=\"aeJson\" class=\"chip\" title=\"Save the scene as celstudio_ae.json — import it into your compositing app with the importer script\">⤓ export motion JSON<\u002Fbutton><button id=\"aeJsx\" class=\"chip\" title=\"Save celstudio_import.jsx — in your compositing app run File → Scripts → Run Script File… and pick the JSON\">⤓ Motion importer (.jsx)<\u002Fbutton><\u002Fdiv>\n      <p class=\"hint tiny\">No host connected? Export the JSON, then in your compositing app run <b>File → Scripts → Run Script File… → celstudio_import.jsx<\u002Fb> and pick the JSON — it rebuilds every frame as native shape layers.<\u002Fp>\n      <p class=\"hint tiny\" hidden=\"\">Moved — everything now lives under the export button in the left rail.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- ===== HELP / WIKI overlay ===== -->\n    <div class=\"helpOverlay\" id=\"helpOverlay\" hidden=\"\">\n      <div class=\"helpModal\">\n        <header class=\"helpBar\">\n          <span class=\"logo\">Calder<span class=\"logo-accent\">Studio<\u002Fspan> <span class=\"helpKicker\">field guide<\u002Fspan><\u002Fspan>\n          <div class=\"helpSearchWrap\">\n            <input type=\"text\" id=\"helpSearch\" placeholder=\"filter…\">\n          <\u002Fdiv>\n          <button class=\"helpClose\" id=\"helpClose\" title=\"Close (Esc)\">✕<\u002Fbutton>\n        <\u002Fheader>\n        <div class=\"helpBody\">\n          <nav class=\"helpNav\" id=\"helpNav\">\n            <button class=\"helpTab active\" data-sec=\"secStart\">getting started<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secCel\">cel process<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secRigProc\">rig process<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secMedia\">sound &amp; video<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secTools\">tools<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secBrush\">brushes<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secFrames\">frames &amp; timeline<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secKeys\">shortcuts<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secRig\">rigging &amp; nodes<\u002Fbutton>\n            <button class=\"helpTab\" data-sec=\"secTut\">tutorials<\u002Fbutton>\n          <\u002Fnav>\n          <div class=\"helpContent\" id=\"helpContent\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n    <\u002Fdiv>\n  <aside id=\"nodeDock\" class=\"collapsed\">\n    <button id=\"ndHandle\" title=\"Show / hide Node Layout\"><span>NODE LAYOUT<\u002Fspan><\u002Fbutton>\n    <div id=\"ndInner\">\n      <header id=\"ndTop\">\n        <span class=\"nd-title\">Node Layout<\u002Fspan>\n        <span class=\"nd-add\">\n          <span class=\"nd-grp\"><span class=\"nd-grp-l\">content<\u002Fspan><button class=\"nd-add-btn\" data-add=\"drawing\"><span class=\"g\">✎<\u002Fspan>Drawing<\u002Fbutton><button class=\"nd-add-btn\" id=\"ndText\" title=\"Text — add a text layer (font, size, colour); transforms like any drawing, re-editable from its ⚙\"><span class=\"g\">T<\u002Fspan>Text<\u002Fbutton><button class=\"nd-add-btn\" id=\"ndImage\" title=\"Import image(s) — one image, or several for a sequence; becomes a drawing node you can peg, blend and render\"><span class=\"g\">▧<\u002Fspan>Image<\u002Fbutton><button class=\"nd-add-btn\" id=\"ndVideo\" title=\"Import a video — a node that plays its frames at the scene playhead; wire it into the composite to see it. Its audio rides the timeline.\"><span class=\"g\">▷<\u002Fspan>Video<\u002Fbutton><button class=\"nd-add-btn\" id=\"ndAudio\" title=\"Import an audio file — a node whose sound rides the timeline; wire it into the composite to hear it\"><span class=\"g\">♫<\u002Fspan>Audio<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"colourcard\"><span class=\"g\">▨<\u002Fspan>Backdrop<\u002Fbutton><\u002Fspan>\n          <span class=\"nd-grp\"><span class=\"nd-grp-l\">rig<\u002Fspan><button class=\"nd-add-btn\" data-add=\"peg\" title=\"Control — moves / rotates / scales everything plugged beneath it (Ctrl+P). With a drawing selected it wires in above it and takes its name.\"><span class=\"g\">⌖<\u002Fspan>Control<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"deform\" title=\"Warp — bones, curve and envelope deformers that bend the drawing beneath\"><span class=\"g\">∿<\u002Fspan>Warp<\u002Fbutton><button class=\"nd-add-btn\" id=\"ndAutoBone\" title=\"Auto Bone — build a bone driver from your controls’ anchor points (2-control bone or arm / leg template)\"><span class=\"g\">🦴<\u002Fspan>Auto Bone<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"master\" title=\"Pose Mixer — capture whole-rig poses and blend them with one slider\"><span class=\"g\">☰<\u002Fspan>Pose Mixer<\u002Fbutton><\u002Fspan>\n          <span class=\"nd-grp\"><span class=\"nd-grp-l\">fx<\u002Fspan><button class=\"nd-add-btn\" data-add=\"cutter\" title=\"Mask — cuts the Img input by the Mat input's silhouette (invert to punch a hole)\"><span class=\"g\">◪<\u002Fspan>Mask<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"blur\"><span class=\"g\">◌<\u002Fspan>Blur<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"glow\"><span class=\"g\">✦<\u002Fspan>Glow<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"sshadow\" title=\"Self Shadow — flattens the character, offsets a dark copy and clips it back inside the outline for a rim / self-shadow. Wire a Control into its Ctl port to drag the shadow around. Plug between a Composite and the Display.\"><span class=\"g\">◗<\u002Fspan>Self Shad.<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"castshadow\" title=\"Shadow — a cast/floor shadow. Outputs ONLY the shadow (not the character), to wire BELOW the character. Feed it the character composite; wire a Control into Ctl and drag its four corners to lay the shadow on a floor plane in perspective.\"><span class=\"g\">◣<\u002Fspan>Shadow<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"boil\" title=\"Line Boil — jitters the line frame-to-frame on 1s/2s/3s/4s (attach to a drawing, or between Composite and Display for a scene-wide boil)\"><span class=\"g\">∾<\u002Fspan>Boil<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"turb\" title=\"Turbulence — smooth wavering displacement; plug between Composite and Display to waver the whole scene\"><span class=\"g\">∿<\u002Fspan>Turb.<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"transparency\"><span class=\"g\">◐<\u002Fspan>Transp.<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"colorsel\" title=\"Colour Select — renders ONLY the chosen palette colour from its input (plug between Composite and Display); masks are respected\"><span class=\"g\">◉<\u002Fspan>Colour Sel.<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"linewidth\" title=\"Line Width: thins the line art passing through it (negative value thickens); plug between a drawing/composite and the next node\"><span class=\"g\">▏<\u002Fspan>Line W.<\u002Fbutton><\u002Fspan>\n          <span class=\"nd-grp\"><span class=\"nd-grp-l\">org<\u002Fspan><button class=\"nd-add-btn\" id=\"ndBackdrop\" title=\"Coloured group box — organises nodes; dragging its title bar moves every node inside it\"><span class=\"g\">▢<\u002Fspan>Group box<\u002Fbutton><\u002Fspan>\n          <span class=\"nd-grp\"><span class=\"nd-grp-l\">scene<\u002Fspan><button class=\"nd-add-btn\" data-add=\"camera\"><span class=\"g\">◎<\u002Fspan>Camera<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"composite\"><span class=\"g\">⧉<\u002Fspan>Composite<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"display\"><span class=\"g\">▣<\u002Fspan>Display<\u002Fbutton><button class=\"nd-add-btn\" data-add=\"write\"><span class=\"g\">⤓<\u002Fspan>Write<\u002Fbutton><\u002Fspan>\n        <\u002Fspan>\n        <span class=\"nd-spacer\"><\u002Fspan>\n        <button id=\"ndAlign\" title=\"Align the selected nodes: tidies them into a row or a column, evenly spaced\">≡<\u002Fbutton>\n        <button id=\"ndReset\" title=\"Reset view: centre the main display node at 100%\">⌖<\u002Fbutton>\n        <button id=\"ndFloat\" title=\"Float the node layout as a window / dock it back\">⧉<\u002Fbutton>\n        <button id=\"ndCollapse\" title=\"Collapse\">❯<\u002Fbutton>\n      <\u002Fheader>\n      <div id=\"ndStage\"><div class=\"nd-grid\"><\u002Fdiv><div id=\"ndWorld\"><svg id=\"ndEdges\"><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <div id=\"ndProps\" hidden=\"\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n  <\u002Fdiv>\n  <div id=\"projModal\" class=\"cs-modal\"><div class=\"cs-sheet cs-proj\">\n    <div class=\"cs-proj-brand\">Calder<span>Studio<\u002Fspan> <span class=\"cs-proj-beta\">Beta V2<\u002Fspan><\u002Fdiv>\n    <h3>Start a project<\u002Fh3>\n    <p class=\"cs-note cs-proj-beta-note\">Early software, free and <b>AS IS<\u002Fb> with no warranty. Expect bugs and changes. <b>Please don't rely on it for professional or deadline work yet<\u002Fb>, and keep your own backups. <a href=\"#\" id=\"pmLic\">Licence &amp; terms<\u002Fa>.<\u002Fp>\n    <p class=\"cs-note\">Your work is saved to a <b>.celae file on your computer<\u002Fb> and auto-saved there every 30&nbsp;seconds — not in the browser. Create a new file or open an existing one to begin.<\u002Fp>\n    <div class=\"cs-proj-btns\">\n      <button class=\"cs-primary\" id=\"pmNew\">+ New project…<\u002Fbutton>\n      <button class=\"cs-ghost\" id=\"pmOpen\">↗ Open project…<\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"cs-proj-skip\" id=\"pmSkip\">or keep working in the browser (no file)<\u002Fbutton>\n    <p class=\"cs-note cs-proj-warn\" id=\"pmWarn\" hidden=\"\">Your browser can't save directly to disk (try Chrome or Edge). Working in the browser instead — use <b>Save project<\u002Fb> in the 💾 menu to export a file.<\u002Fp>\n  <\u002Fdiv><\u002Fdiv>\n  <div id=\"keysModal\" class=\"cs-modal\" hidden=\"\"><div class=\"cs-sheet cs-keys\">\n    <h3>Keyboard shortcuts<\u002Fh3>\n    <p class=\"cs-note\">Click a key to record a new one. These override the defaults; Ctrl/Cmd combos (undo, copy, paste) aren’t remappable.<\u002Fp>\n    <div id=\"keysList\" class=\"cs-keys-list\"><\u002Fdiv>\n    <div class=\"cs-actions\"><button class=\"cs-ghost\" id=\"keysReset\">Reset all<\u002Fbutton><button class=\"cs-primary\" id=\"keysDone\">Done<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div id=\"renderModal\" class=\"cs-modal\" hidden=\"\"><div class=\"cs-sheet\">\n    <h3>Render / Export<\u002Fh3>\n    <div class=\"cs-row\"><label>Preset<\u002Flabel><span id=\"rPresets\" style=\"display:flex;gap:6px;flex-wrap:wrap\">\n      <button class=\"cs-ghost\" type=\"button\" data-preset=\"mp4:canvas:24\">MP4 · native<\u002Fbutton>\n      <button class=\"cs-ghost\" type=\"button\" data-preset=\"mp4:1280:24\">MP4 · 1280<\u002Fbutton>\n      <button class=\"cs-ghost\" type=\"button\" data-preset=\"gif:640:12\">GIF · 640 · 12fps<\u002Fbutton>\n      <button class=\"cs-ghost\" type=\"button\" data-preset=\"pngalpha:canvas:24\">PNG seq · alpha<\u002Fbutton>\n      <button class=\"cs-ghost\" type=\"button\" data-preset=\"json:canvas:24\">Motion (JSON)<\u002Fbutton>\n    <\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\"><label>Format<\u002Flabel>\n      <select id=\"rFormat\">\n        <option value=\"mp4\">Video — MP4 (H.264)<\u002Foption>\n        <option value=\"webm\">Video — WebM (VP9)<\u002Foption>\n        <option value=\"lottie\">Lottie / Bodymovin JSON (vector)<\u002Foption>\n        <option value=\"gif\">Animated GIF<\u002Foption>\n        <option value=\"webpanim\">Animated WebP (full colour, much smaller than GIF)<\u002Foption>\n        <option value=\"webpanimalpha\">Animated WebP (transparent)<\u002Foption>\n        <option value=\"png\">PNG sequence<\u002Foption>\n        <option value=\"pngalpha\">PNG sequence (transparent)<\u002Foption>\n        <option value=\"webp\">WebP sequence<\u002Foption>\n        <option value=\"webpalpha\">WebP sequence (transparent)<\u002Foption>\n        <option value=\"jpeg\">JPEG sequence<\u002Foption>\n        <option value=\"svg\">SVG sequence (vector)<\u002Foption>\n        <option value=\"pdfseq\">PDF sequence (vector — scalable, for After Effects)<\u002Foption>\n        <option value=\"json\">JSON (motion / compositing payload)<\u002Foption>\n      <\u002Fselect><\u002Fdiv>\n    <div class=\"cs-row\" id=\"rLineDetailRow\" hidden=\"\"><label>Line detail<\u002Flabel>\n      <select id=\"rLineDetail\">\n        <option value=\"8\">Standard — smaller file<\u002Foption>\n        <option value=\"5\">Fine — denser lines, larger file<\u002Foption>\n        <option value=\"12\">Coarse — smallest file<\u002Foption>\n      <\u002Fselect>\n      <span class=\"cs-muted\">how finely warped lines are sampled in the vector export<\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\"><label>Resolution<\u002Flabel>\n      <select id=\"rRes\">\n        <option value=\"canvas\" selected=\"\">Canvas (native)<\u002Foption>\n        <option value=\"2x\">2× canvas (extra crisp)<\u002Foption>\n        <option value=\"1280\">1280 wide<\u002Foption>\n        <option value=\"960\">960 wide<\u002Foption>\n        <option value=\"640\">640 wide (small GIF)<\u002Foption>\n        <option value=\"custom\">Custom…<\u002Foption>\n      <\u002Fselect>\n      <span id=\"rResCustom\" hidden=\"\"><input type=\"number\" id=\"rW\" min=\"64\" max=\"4096\" style=\"width:74px\"> × <input type=\"number\" id=\"rH\" style=\"width:74px\" disabled=\"\" title=\"Height follows the canvas aspect\"><\u002Fspan>\n      <span class=\"cs-muted\" id=\"rResInfo\"><\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\"><label>File name<\u002Flabel><input type=\"text\" id=\"rName\" value=\"celstudio_render\" style=\"width:200px\" title=\"Name for the rendered file (sequences number themselves from this)\"><span class=\"cs-muted\" id=\"rNameExt\"><\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\"><label>Frame rate<\u002Flabel><input type=\"number\" id=\"rFps\" value=\"24\" min=\"1\" max=\"60\" style=\"width:84px\"><span class=\"cs-muted\">fps<\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\"><label>Scene length<\u002Flabel><input type=\"number\" id=\"rLen\" min=\"1\" value=\"48\" style=\"width:84px\"><span class=\"cs-muted\" id=\"rLenSecs\">frames<\u002Fspan><\u002Fdiv>\n    <div class=\"cs-row\" id=\"rRangeRow\"><label>Source<\u002Flabel><span id=\"rRange\" class=\"cs-muted\">timeline exposure<\u002Fspan><\u002Fdiv>\n    <p class=\"cs-note\" id=\"rNote\">Asks where to save FIRST, renders at the chosen resolution (strokes are vector — they stay sharp at any size), then shows the finished render. Image sequences ask for a destination folder. GIF uses an adaptive palette with dithering. MOV isn't offered because browsers can only encode MP4 / WebM — MP4 opens fine in QuickTime.<\u002Fp>\n    <div class=\"cs-actions\"><button class=\"cs-ghost\" id=\"rCancel\">Cancel<\u002Fbutton><button class=\"cs-primary\" id=\"rGo\">Render ▶<\u002Fbutton><\u002Fdiv>\n    <div id=\"rProgress\" class=\"cs-progress\" hidden=\"\"><div id=\"rBar\"><\u002Fdiv><span id=\"rPct\">0%<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div id=\"curveModal\" class=\"cs-modal\" hidden=\"\"><div class=\"cs-sheet cs-curve\">\n    <h3>Ease — interpolation curve<\u002Fh3>\n    <canvas id=\"curveCanvas\" width=\"320\" height=\"300\"><\u002Fcanvas>\n    <div class=\"cs-curveval\"><span id=\"curveVal\">0.42, 0, 0.58, 1<\u002Fspan><\u002Fdiv>\n    <div class=\"cs-easerow\">\n      <label class=\"cs-easebox\">Ease In<input type=\"number\" id=\"easeIn\" min=\"0\" max=\"100\" value=\"33\"><i>%<\u002Fi><\u002Flabel>\n      <div class=\"cs-sidetoggle\" id=\"cSide\">\n        <button type=\"button\" data-side=\"in\" title=\"Apply to ease-in side only\">‹<\u002Fbutton>\n        <button type=\"button\" data-side=\"both\" class=\"on\" title=\"Apply to both sides\">⌣<\u002Fbutton>\n        <button type=\"button\" data-side=\"out\" title=\"Apply to ease-out side only\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"cs-easebox\">Ease Out<input type=\"number\" id=\"easeOut\" min=\"0\" max=\"100\" value=\"33\"><i>%<\u002Fi><\u002Flabel>\n    <\u002Fdiv>\n    <p class=\"cs-note\">Drag the two orange handles, or type 0–100 in each box. The middle toggle applies the curve to both sides, or just in / just out (it doesn’t change the numbers).<\u002Fp>\n    <div class=\"cs-actions\"><button class=\"cs-ghost\" id=\"cCancel\">Cancel<\u002Fbutton><button class=\"cs-primary\" id=\"cApply\">Apply<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <script src=\"485a6f43-1a1c-4e04-bfb9-a0bf766339a2\"><\u002Fscript>\n  <script src=\"0e44ab02-6f02-4067-9a19-1ea9f8ccb95e\"><\u002Fscript>\n  <script src=\"cdeecd3f-fbcd-479e-bf08-9da1ff3c19e6\"><\u002Fscript>\n  <script src=\"82d61b97-c2bb-457c-9791-67abd9c4f626\"><\u002Fscript>\n  <script src=\"7370719b-64e9-44e2-afb7-3fa75d44e9c2\"><\u002Fscript>\n  <script src=\"ae0998f5-dd2d-4188-8d71-c7bd2e5418de\"><\u002Fscript>\n  <script src=\"e4f80d33-79b4-40d5-a97d-0b015a344720\"><\u002Fscript>\n  <script src=\"c241dbbf-d1e8-4fcd-bb26-1fa2d12de100\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
